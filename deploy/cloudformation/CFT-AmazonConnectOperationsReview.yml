          def validate_connect_alarms(cw_client, instance_id, start_time, time_budget):
              """Validate recommended CloudWatch alarms for a Connect instance.

              Checks existing CloudWatch alarms against the recommended set, identifying
              which recommended alarms are configured, which are missing, and any extra
              Connect alarms that exist beyond the recommendations.

              Args:
                  cw_client: Boto3 CloudWatch client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Alarm validation findings with found, missing, and extra lists.
              """
              check_time_budget(start_time, time_budget)

              # Collect all existing Connect alarms for this instance
              existing = []
              try:
                  paginator = cw_client.get_paginator("describe_alarms")
                  for page in paginator.paginate():
                      check_time_budget(start_time, time_budget)
                      for alarm in page.get("MetricAlarms", []):
                          if alarm.get("Namespace") != "AWS/Connect":
                              continue
                          for dim in alarm.get("Dimensions", []):
                              if dim["Name"] == "InstanceId" and dim["Value"] == instance_id:
                                  existing.append(alarm)
                                  break
              except ClientError as e:
                  logger.error(f"Error fetching CloudWatch alarms: {e}")
                  return {
                      "found": [],
                      "missing": [],
                      "extra": [],
                      "total_recommended": len(RECOMMENDED_CONNECT_ALARMS),
                      "coverage_pct": 0,
                      "triggered_count": 0,
                      "status": "error",
                      "detail": str(e)[:1024],
                  }

              found = []
              missing = []
              recommended_metrics = set()

              for rec in RECOMMENDED_CONNECT_ALARMS:
                  recommended_metrics.add(rec["metric_name"])
                  matched = None
                  for alarm in existing:
                      if (
                          alarm.get("MetricName") == rec["metric_name"]
                          and alarm.get("Namespace") == rec["namespace"]
                      ):
                          has_instance = any(
                              d["Name"] == "InstanceId" and d["Value"] == instance_id
                              for d in alarm.get("Dimensions", [])
                          )
                          if has_instance:
                              matched = alarm
                              break

                  entry = {
                      "metric_name": rec["metric_name"],
                      "description": rec["description"],
                      "severity": rec["severity"],
                      "rec_statistic": rec["statistic"],
                      "rec_threshold": rec["threshold"],
                      "rec_period": rec["period"],
                      "rec_comparison": rec["comparison"],
                  }
                  if matched:
                      entry["alarm_name"] = matched["AlarmName"]
                      entry["alarm_state"] = matched.get("StateValue", "UNKNOWN")
                      entry["actual_statistic"] = matched.get("Statistic", "N/A")
                      entry["actual_threshold"] = matched.get("Threshold", "N/A")
                      entry["actual_period"] = matched.get("Period", "N/A")
                      entry["has_actions"] = bool(matched.get("AlarmActions"))
                      found.append(entry)
                  else:
                      missing.append(entry)

              # Identify extra alarms not in recommendations
              extra = []
              for alarm in existing:
                  if alarm.get("MetricName") not in recommended_metrics:
                      extra.append(
                          {
                              "alarm_name": alarm["AlarmName"],
                              "metric_name": alarm.get("MetricName"),
                              "state": alarm.get("StateValue"),
                          }
                      )

              total_recommended = len(RECOMMENDED_CONNECT_ALARMS)
              found_count = len(found)
              coverage_pct = (
                  round((found_count / total_recommended) * 100, 1) if total_recommended else 0
              )
              triggered_count = sum(1 for f in found if f.get("alarm_state") == "ALARM")

              # Determine status
              if len(missing) > 0 and triggered_count > 0:
                  status = "fail"
                  detail = f"{len(missing)} recommended alarms missing, {triggered_count} in ALARM state"
              elif len(missing) > 0:
                  status = "warn"
                  detail = f"{len(missing)} of {total_recommended} recommended alarms missing"
              elif triggered_count > 0:
                  status = "fail"
                  detail = f"All configured, {triggered_count} in ALARM state"
              else:
                  status = "pass"
                  detail = f"All {found_count} recommended alarms configured"

              return {
                  "found": found,
                  "missing": missing,
                  "extra": extra,
                  "total_recommended": total_recommended,
                  "found_count": found_count,
                  "missing_count": len(missing),
                  "coverage_pct": coverage_pct,
                  "triggered_count": triggered_count,
                  "status": status,
                  "detail": detail,
              }


          def check_missed_calls_metrics(
              cw_client, instance_id, days_back, start_time, time_budget
          ):
              """Analyze missed calls CloudWatch metrics over the specified period.

              Retrieves daily missed call statistics and computes summary metrics
              including totals, averages, peaks, and week-over-week trends.

              Args:
                  cw_client: Boto3 CloudWatch client.
                  instance_id (str): Connect instance ID.
                  days_back (int): Number of days to analyze.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Missed calls metrics findings.
              """
              check_time_budget(start_time, time_budget)

              end_time = datetime.now(timezone.utc)
              cw_start_time = end_time - timedelta(days=days_back)

              try:
                  response = cw_client.get_metric_statistics(
                      Namespace="AWS/Connect",
                      MetricName="MissedCalls",
                      Dimensions=[
                          {"Name": "InstanceId", "Value": instance_id},
                          {"Name": "MetricGroup", "Value": "VoiceCalls"},
                      ],
                      StartTime=cw_start_time,
                      EndTime=end_time,
                      Period=86400,  # Daily statistics
                      Statistics=["Sum"],
                  )
              except ClientError as e:
                  logger.error(f"Error fetching missed calls metrics: {e}")
                  return {
                      "total_missed_calls": 0,
                      "daily_average": 0,
                      "peak_day_count": 0,
                      "peak_day_date": None,
                      "days_analyzed": days_back,
                      "status": "error",
                      "detail": str(e)[:1024],
                  }

              # Process daily data
              daily_data = []
              total_missed_calls = 0

              for datapoint in sorted(
                  response.get("Datapoints", []), key=lambda x: x["Timestamp"]
              ):
                  date_str = datapoint["Timestamp"].strftime("%Y-%m-%d")
                  missed_calls = int(datapoint["Sum"])
                  total_missed_calls += missed_calls
                  daily_data.append({"date": date_str, "count": missed_calls})

              if not daily_data:
                  return {
                      "total_missed_calls": 0,
                      "daily_average": 0,
                      "peak_day_count": 0,
                      "peak_day_date": None,
                      "daily_data": [],
                      "days_analyzed": days_back,
                      "status": "info",
                      "detail": "No missed calls data available for the specified period",
                  }

              counts = [d["count"] for d in daily_data]
              daily_average = round(sum(counts) / len(counts), 1)
              peak_idx = counts.index(max(counts))
              peak_day_count = counts[peak_idx]
              peak_day_date = daily_data[peak_idx]["date"]

              # Week-over-week comparison
              midpoint = len(daily_data) // 2
              first_half = counts[:midpoint] if midpoint > 0 else []
              second_half = counts[midpoint:] if midpoint > 0 else counts

              week_over_week_change = None
              if first_half and sum(first_half) > 0:
                  first_avg = sum(first_half) / len(first_half)
                  second_avg = sum(second_half) / len(second_half)
                  week_over_week_change = round(((second_avg - first_avg) / first_avg) * 100, 1)

              # Determine status
              if total_missed_calls > 50:
                  status = "warn"
                  detail = f"{total_missed_calls:,} missed calls in last {days_back} days"
              elif total_missed_calls > 0:
                  status = "pass"
                  detail = f"{total_missed_calls:,} missed calls in last {days_back} days"
              else:
                  status = "pass"
                  detail = "No missed calls detected"

              return {
                  "total_missed_calls": total_missed_calls,
                  "daily_average": daily_average,
                  "peak_day_count": peak_day_count,
                  "peak_day_date": peak_day_date,
                  "week_over_week_change": week_over_week_change,
                  "daily_data": daily_data,
                  "days_analyzed": days_back,
                  "status": status,
                  "detail": detail,
              }


          def check_connect_log_groups(
              logs_client, instance_id, aws_region, start_time, time_budget
          ):
              """Check CloudWatch Log Groups related to the Amazon Connect instance.

              Identifies Connect-related log groups (contact flow logs, contact lens,
              etc.) and checks their retention configuration.

              Args:
                  logs_client: Boto3 CloudWatch Logs client.
                  instance_id (str): Connect instance ID.
                  aws_region (str): AWS region.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Log group findings.
              """
              check_time_budget(start_time, time_budget)

              # Connect-related log group prefixes/patterns
              connect_log_prefixes = [
                  f"/aws/connect/{instance_id}",
                  "/aws/connect/",
              ]

              connect_log_groups = []
              no_retention_groups = []

              try:
                  for prefix in connect_log_prefixes:
                      check_time_budget(start_time, time_budget)
                      paginator = logs_client.get_paginator("describe_log_groups")
                      for page in paginator.paginate(logGroupNamePrefix=prefix):
                          check_time_budget(start_time, time_budget)
                          for lg in page.get("logGroups", []):
                              log_group_name = lg.get("logGroupName", "")
                              # Avoid duplicates from overlapping prefixes
                              if any(
                                  g["log_group_name"] == log_group_name
                                  for g in connect_log_groups
                              ):
                                  continue
                              retention_days = lg.get("retentionInDays")
                              stored_bytes = lg.get("storedBytes", 0)
                              entry = {
                                  "log_group_name": log_group_name,
                                  "retention_days": retention_days,
                                  "stored_bytes": stored_bytes,
                                  "has_retention_policy": retention_days is not None,
                              }
                              connect_log_groups.append(entry)
                              if retention_days is None:
                                  no_retention_groups.append(entry)
              except ClientError as e:
                  logger.error(f"Error describing log groups: {e}")
                  return {
                      "total_log_groups": 0,
                      "no_retention_count": 0,
                      "log_groups": [],
                      "status": "error",
                      "detail": str(e)[:1024],
                  }

              if not connect_log_groups:
                  return {
                      "total_log_groups": 0,
                      "no_retention_count": 0,
                      "log_groups": [],
                      "status": "info",
                      "detail": "No Connect-related CloudWatch Log Groups found",
                  }

              if no_retention_groups:
                  status = "warn"
                  detail = (
                      f"{len(no_retention_groups)}/{len(connect_log_groups)} "
                      f"log group(s) have no retention policy (logs retained indefinitely)"
                  )
              else:
                  status = "pass"
                  detail = f"All {len(connect_log_groups)} log group(s) have retention policies configured"

              return {
                  "total_log_groups": len(connect_log_groups),
                  "no_retention_count": len(no_retention_groups),
                  "log_groups": connect_log_groups,
                  "status": status,
                  "detail": detail,
              }


          def validate_kinesis_stream_alarms(
              connect_client, cw_client, instance_id, instance_arn, start_time, time_budget
          ):
              """Validate CloudWatch alarms for Kinesis Data Streams associated with Connect.

              Discovers Kinesis streams configured for the Connect instance (CTR streaming,
              agent event streaming) via instance storage configs, then checks whether
              recommended CloudWatch alarms exist for each stream.

              Args:
                  connect_client: Boto3 Connect client.
                  cw_client: Boto3 CloudWatch client.
                  instance_id (str): Connect instance ID.
                  instance_arn (str): Connect instance ARN.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Kinesis alarm validation findings with found, missing, coverage_pct, status, detail.
              """
              check_time_budget(start_time, time_budget)

              # Discover Kinesis streams associated with this Connect instance
              kinesis_stream_arns = []
              storage_resource_types = [
                  "CONTACT_TRACE_RECORDS",
                  "AGENT_EVENTS",
              ]

              try:
                  for resource_type in storage_resource_types:
                      check_time_budget(start_time, time_budget)
                      try:
                          response = connect_client.list_instance_storage_configs(
                              InstanceId=instance_id,
                              ResourceType=resource_type,
                          )
                          for config in response.get("StorageConfigs", []):
                              if config.get("StorageType") == "KINESIS_STREAM":
                                  stream_config = config.get("KinesisStreamConfig", {})
                                  stream_arn = stream_config.get("StreamArn", "")
                                  if stream_arn and stream_arn not in kinesis_stream_arns:
                                      kinesis_stream_arns.append(stream_arn)
                      except ClientError as e:
                          # Some resource types may not be configured; continue checking others
                          logger.warning(
                              f"Could not list storage configs for {resource_type}: {e}"
                          )
                          continue
              except ClientError as e:
                  logger.error(f"Error discovering Kinesis streams for Connect instance: {e}")
                  return {
                      "streams_found": [],
                      "found": [],
                      "missing": [],
                      "total_recommended": 0,
                      "coverage_pct": 0,
                      "status": "error",
                      "detail": str(e)[:1024],
                  }

              # Extract stream names from ARNs
              stream_names = []
              for arn in kinesis_stream_arns:
                  # ARN format: arn:aws:kinesis:region:account:stream/stream-name
                  parts = arn.split("/")
                  if len(parts) >= 2:
                      stream_names.append(parts[-1])

              if not stream_names:
                  return {
                      "streams_found": [],
                      "found": [],
                      "missing": [],
                      "total_recommended": 0,
                      "coverage_pct": 0,
                      "status": "info",
                      "detail": "No Kinesis Data Streams associated with this Connect instance",
                  }

              # Check CloudWatch alarms for each stream
              found = []
              missing = []

              try:
                  for stream_name in stream_names:
                      check_time_budget(start_time, time_budget)

                      # Get all alarms in AWS/Kinesis namespace for this stream
                      existing_alarms = []
                      paginator = cw_client.get_paginator("describe_alarms")
                      for page in paginator.paginate():
                          check_time_budget(start_time, time_budget)
                          for alarm in page.get("MetricAlarms", []):
                              if alarm.get("Namespace") != "AWS/Kinesis":
                                  continue
                              for dim in alarm.get("Dimensions", []):
                                  if dim["Name"] == "StreamName" and dim["Value"] == stream_name:
                                      existing_alarms.append(alarm)
                                      break

                      # Check each recommended alarm against existing alarms
                      for rec in RECOMMENDED_KINESIS_ALARMS:
                          matched = None
                          for alarm in existing_alarms:
                              if alarm.get("MetricName") == rec["metric_name"]:
                                  matched = alarm
                                  break

                          entry = {
                              "stream_name": stream_name,
                              "metric_name": rec["metric_name"],
                              "description": rec["description"],
                              "severity": rec["severity"],
                              "rec_statistic": rec["statistic"],
                              "rec_threshold": rec["threshold"],
                              "rec_period": rec["period"],
                              "rec_comparison": rec["comparison"],
                          }
                          if matched:
                              entry["alarm_name"] = matched["AlarmName"]
                              entry["alarm_state"] = matched.get("StateValue", "UNKNOWN")
                              entry["has_actions"] = bool(matched.get("AlarmActions"))
                              found.append(entry)
                          else:
                              missing.append(entry)
              except ClientError as e:
                  logger.error(f"Error checking Kinesis stream alarms: {e}")
                  return {
                      "streams_found": stream_names,
                      "found": found,
                      "missing": missing,
                      "total_recommended": len(RECOMMENDED_KINESIS_ALARMS) * len(stream_names),
                      "coverage_pct": 0,
                      "status": "error",
                      "detail": str(e)[:1024],
                  }

              total_recommended = len(RECOMMENDED_KINESIS_ALARMS) * len(stream_names)
              found_count = len(found)
              coverage_pct = (
                  round((found_count / total_recommended) * 100, 1) if total_recommended else 0
              )

              # Determine status
              if len(missing) > 0:
                  status = "warn"
                  detail = (
                      f"{len(missing)} of {total_recommended} recommended Kinesis alarms missing "
                      f"across {len(stream_names)} stream(s)"
                  )
              else:
                  status = "pass"
                  detail = f"All {found_count} recommended Kinesis alarms configured across {len(stream_names)} stream(s)"

              return {
                  "streams_found": stream_names,
                  "found": found,
                  "missing": missing,
                  "total_recommended": total_recommended,
                  "found_count": found_count,
                  "missing_count": len(missing),
                  "coverage_pct": coverage_pct,
                  "status": status,
                  "detail": detail,
              }


          def lambda_handler(event, context):
              """Observability Analyzer Lambda handler.

              Validates input using shared validate_input, checks CloudWatch alarms,
              missed calls metrics, and log group configuration with graceful timeout,
              persists results to S3 Hive-style path, and returns a standardized
              AnalyzerResult.

              Args:
                  event (dict): Input event with reviewId, instanceId, instanceArn,
                                accountId, awsRegion, daysBack, componentType,
                                s3ReportingBucket, and optional maxSeconds.
                  context: Lambda context object.

              Returns:
                  dict: Standardized AnalyzerResult (success or error).
              """
              logger.info("Observability Analyzer invoked")
              execution_start = time.time()

              # Validate required input fields using shared utility
              try:
                  validate_input(event)
              except ValueError as e:
                  logger.error(str(e))
                  return error_result(
                      event.get("componentType", "observability"),
                      str(e),
                  )

              instance_id = event["instanceId"]
              instance_arn = event["instanceArn"]
              account_id = event["accountId"]
              aws_region = event["awsRegion"]
              days_back = event["daysBack"]
              component_type = event["componentType"]

              # Accept maxSeconds from event payload (passed via analyzerTimeouts from PrepareContext)
              max_seconds = event.get("maxSeconds", DEFAULT_MAX_SECONDS)

              # Compute internal time budget using shared graceful timeout utility
              time_budget = compute_time_budget(max_seconds)

              logger.info(
                  f"Analyzing observability for instance={instance_id}, "
                  f"account={account_id}, region={aws_region}, "
                  f"max_seconds={max_seconds}, time_budget={time_budget}"
              )

              cloudwatch_client = boto3.client("cloudwatch", region_name=aws_region)
              logs_client = boto3.client("logs", region_name=aws_region)
              connect_client = boto3.client("connect", region_name=aws_region)
              checks_completed = []

              try:
                  # Check 1: CloudWatch Alarm Validation
                  alarm_findings = validate_connect_alarms(
                      cloudwatch_client, instance_id, execution_start, time_budget
                  )
                  checks_completed.append("cloudwatch_alarms")

                  # Check 2: Missed Calls Metrics
                  missed_calls_findings = check_missed_calls_metrics(
                      cloudwatch_client,
                      instance_id,
                      days_back,
                      execution_start,
                      time_budget,
                  )
                  checks_completed.append("missed_calls_metrics")

                  # Check 3: CloudWatch Log Groups
                  log_group_findings = check_connect_log_groups(
                      logs_client,
                      instance_id,
                      aws_region,
                      execution_start,
                      time_budget,
                  )
                  checks_completed.append("log_groups")

                  # Check 4: Kinesis Data Streams Alarm Validation
                  kinesis_findings = validate_kinesis_stream_alarms(
                      connect_client,
                      cloudwatch_client,
                      instance_id,
                      instance_arn,
                      execution_start,
                      time_budget,
                  )
                  checks_completed.append("kinesis_data_streams")

                  findings = {
                      "cloudwatch_alarms": alarm_findings,
                      "missed_calls_metrics": missed_calls_findings,
                      "log_groups": log_group_findings,
                      "kinesis_data_streams": kinesis_findings,
                      "checks_completed": checks_completed,
                      "timed_out": False,
                      "account_id": account_id,
                      "region": aws_region,
                  }

                  # Persist results to S3 Hive-style path before returning
                  s3_key = persist_to_s3(event, findings)

                  duration_ms = int((time.time() - execution_start) * 1000)

                  logger.info(
                      f"Observability analysis complete: {len(checks_completed)} checks completed"
                  )

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                  )

              except TimeBudgetExceeded:
                  logger.info(
                      f"Observability Analyzer reached time budget after completing "
                      f"{len(checks_completed)} of 4 checks: {checks_completed}"
                  )

                  # Build partial findings from whatever checks completed
                  findings = {
                      "checks_completed": checks_completed,
                      "timed_out": True,
                      "account_id": account_id,
                      "region": aws_region,
                  }
                  if "cloudwatch_alarms" in checks_completed:
                      findings["cloudwatch_alarms"] = alarm_findings
                  if "missed_calls_metrics" in checks_completed:
                      findings["missed_calls_metrics"] = missed_calls_findings
                  if "log_groups" in checks_completed:
                      findings["log_groups"] = log_group_findings
                  if "kinesis_data_streams" in checks_completed:
                      findings["kinesis_data_streams"] = kinesis_findings

                  collected_count = len(checks_completed)
                  total_estimated = 4  # Total number of observability checks

                  # Persist partial results to S3 before returning
                  s3_key = persist_to_s3(
                      event,
                      findings,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

                  duration_ms = int((time.time() - execution_start) * 1000)

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

              except ClientError as e:
                  error_msg = str(e)
                  logger.error(f"AWS API error in Observability Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)
              except Exception as e:
                  error_msg = str(e)
                  logger.error(f"Unexpected error in Observability Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)

  # ---------------------------------------------------------------------------
  # Lambda Function — Cost Analyzer
  # ---------------------------------------------------------------------------
  CostAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Cost considerations — telephony, usage patterns, optimization
        opportunities
      FunctionName: ConnectOpsReview-CostAnalyzer
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
          COMPONENT_TYPE: cost
      Code:
        ZipFile: |
          # Cost Analyzer Lambda Function
          #
          # Standalone Lambda that performs cost analysis for Amazon Connect instances,
          # analyzing telephony usage patterns, channel mix, and cost optimization
          # opportunities. Extracted from the monolithic lambda_function.py as part of
          # the parallel orchestration architecture.
          #
          # Uses shared utilities from analyzer_common and graceful_timeout modules
          # for standardized input validation, result formatting, S3 persistence,
          # and time budget management.

          import boto3
          import logging
          import time
          from datetime import datetime, timezone, timedelta
          from botocore.exceptions import ClientError

          from analyzer_common import (
              validate_input,
              success_result,
              error_result,
              persist_to_s3,
              fetch_phone_numbers,
          )
          from graceful_timeout import compute_time_budget, check_time_budget, TimeBudgetExceeded

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Default time budget if maxSeconds not provided in event payload
          DEFAULT_MAX_SECONDS = 240

          # Channel ordering for consistent output
          CHANNEL_ORDER = ["VOICE", "CHAT", "EMAIL", "TASK", "GUIDE"]


          def get_channel_usage(
              connect_client, instance_id, instance_arn, days_back, start_time, time_budget
          ):
              """Get contact counts by channel using GetMetricDataV2.

              Queries Amazon Connect metrics API for contact volume, handle time,
              and channel distribution over the specified period.

              Args:
                  connect_client: Boto3 Connect client (regional).
                  instance_id (str): Connect instance ID.
                  instance_arn (str): Connect instance ARN.
                  days_back (int): Number of days to look back.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Channel usage data keyed by channel name, each containing
                        CONTACTS_CREATED, CONTACTS_HANDLED, AVG_HANDLE_TIME, SUM_HANDLE_TIME.
              """
              check_time_budget(start_time, time_budget)

              end_time_dt = datetime.now(timezone.utc)
              start_time_dt = end_time_dt - timedelta(days=days_back)

              # Need at least one queue filter for GetMetricDataV2
              try:
                  queues_resp = connect_client.list_queues(
                      InstanceId=instance_id, QueueTypes=["STANDARD"]
                  )
                  queue_arns = [q["Arn"] for q in queues_resp.get("QueueSummaryList", [])]
              except ClientError as e:
                  logger.warning(f"Error listing queues: {e}")
                  return {}

              if not queue_arns:
                  logger.info("No queues found — cannot query channel usage")
                  return {}

              results = {}
              next_token = None

              while True:
                  check_time_budget(start_time, time_budget)

                  kwargs = dict(
                      ResourceArn=instance_arn,
                      StartTime=start_time_dt,
                      EndTime=end_time_dt,
                      Interval={"TimeZone": "UTC", "IntervalPeriod": "TOTAL"},
                      Filters=[{"FilterKey": "QUEUE", "FilterValues": queue_arns}],
                      Groupings=["CHANNEL"],
                      Metrics=[
                          {"Name": "CONTACTS_CREATED"},
                          {"Name": "CONTACTS_HANDLED"},
                          {"Name": "AVG_HANDLE_TIME"},
                          {"Name": "SUM_HANDLE_TIME"},
                      ],
                  )
                  if next_token:
                      kwargs["NextToken"] = next_token

                  try:
                      resp = connect_client.get_metric_data_v2(**kwargs)
                  except ClientError as e:
                      logger.error(f"Error calling get_metric_data_v2: {e}")
                      break

                  for mr in resp.get("MetricResults", []):
                      channel = mr.get("Dimensions", {}).get("CHANNEL", "UNKNOWN")
                      if channel not in results:
                          results[channel] = {}
                      for col in mr.get("Collections", []):
                          metric_name = col["Metric"]["Name"]
                          results[channel][metric_name] = col.get("Value", 0)

                  next_token = resp.get("NextToken")
                  if not next_token:
                      break

              return results


          def analyze_channel_mix(channel_usage):
              """Analyze channel mix and generate cost optimization recommendations.

              Evaluates the distribution of contacts across channels and identifies
              opportunities to reduce costs through channel deflection, multi-channel
              routing, and handle time optimization.

              Args:
                  channel_usage (dict): Channel usage data from get_channel_usage.

              Returns:
                  dict: Channel mix analysis with per-channel metrics, totals,
                        and cost optimization recommendations.
              """
              if not channel_usage:
                  return {
                      "channels": [],
                      "total_created": 0,
                      "total_handled": 0,
                      "recommendations": [],
                      "status": "info",
                      "detail": "No contact data available for analysis",
                  }

              # Order channels consistently
              all_channels = list(channel_usage.keys())
              ordered = [ch for ch in CHANNEL_ORDER if ch in all_channels]
              ordered += [ch for ch in all_channels if ch not in ordered]

              channels = []
              total_created = 0
              total_handled = 0
              channel_created = {}
              channel_sum_ht = {}

              for ch in ordered:
                  metrics = channel_usage[ch]
                  created = int(metrics.get("CONTACTS_CREATED", 0))
                  handled = int(metrics.get("CONTACTS_HANDLED", 0))
                  avg_ht = metrics.get("AVG_HANDLE_TIME", 0)
                  sum_ht = metrics.get("SUM_HANDLE_TIME", 0)

                  total_created += created
                  total_handled += handled
                  channel_created[ch] = created
                  channel_sum_ht[ch] = sum_ht

                  channels.append(
                      {
                          "channel": ch,
                          "contacts_created": created,
                          "contacts_handled": handled,
                          "avg_handle_time_seconds": round(avg_ht, 1) if avg_ht else 0,
                          "sum_handle_time_seconds": round(sum_ht, 1) if sum_ht else 0,
                      }
                  )

              # Generate cost optimization recommendations
              recommendations = []

              voice_created = channel_created.get("VOICE", 0)
              chat_created = channel_created.get("CHAT", 0)
              task_created = channel_created.get("TASK", 0)
              email_created = channel_created.get("EMAIL", 0)

              voice_pct = (voice_created / total_created * 100) if total_created > 0 else 0
              chat_pct = (chat_created / total_created * 100) if total_created > 0 else 0

              voice_sum_ht = channel_sum_ht.get("VOICE", 0)
              voice_avg_ht = (voice_sum_ht / voice_created) if voice_created > 0 else 0

              if voice_pct > 80 and total_created > 100:
                  recommendations.append(
                      {
                          "type": "channel_voice_heavy",
                          "severity": "warn",
                          "detail": (
                              f"Voice contacts represent {voice_pct:.0f}% of total volume. "
                              "Voice is billed per minute — consider deflecting routine inquiries "
                              "to chat or tasks where applicable."
                          ),
                      }
                  )

              if chat_created == 0 and voice_created > 100:
                  recommendations.append(
                      {
                          "type": "channel_no_chat",
                          "severity": "info",
                          "detail": (
                              "No chat contacts detected. Enabling chat can reduce costs for "
                              "routine inquiries — agents can handle multiple concurrent chats "
                              "vs. one voice call at a time."
                          ),
                      }
                  )

              if task_created == 0 and total_created > 100:
                  recommendations.append(
                      {
                          "type": "channel_no_tasks",
                          "severity": "info",
                          "detail": (
                              "No task contacts detected. Tasks can automate follow-up work items "
                              "at a lower cost than voice (billed per task rather than per minute)."
                          ),
                      }
                  )

              if voice_avg_ht > 600 and voice_created > 50:
                  recommendations.append(
                      {
                          "type": "channel_high_voice_ht",
                          "severity": "warn",
                          "detail": (
                              f"Average voice handle time is {int(voice_avg_ht // 60)}m "
                              f"{int(voice_avg_ht % 60)}s. Long handle times increase per-minute "
                              "voice costs. Consider step-by-step guides or AI agent assist to "
                              "reduce handle time."
                          ),
                      }
                  )

              if chat_pct > 0 and voice_pct > 0:
                  recommendations.append(
                      {
                          "type": "channel_multi_channel",
                          "severity": "info",
                          "detail": (
                              f"Multi-channel active (voice {voice_pct:.0f}%, chat {chat_pct:.0f}%). "
                              "Ensure routing profiles allow agents to handle concurrent chats "
                              "alongside voice to maximize utilization and reduce cost per contact."
                          ),
                      }
                  )

              if email_created > 0:
                  recommendations.append(
                      {
                          "type": "channel_email_active",
                          "severity": "info",
                          "detail": (
                              f"Email channel active with {email_created} contacts. "
                              "Consider auto-responses and AI agent assist to draft replies "
                              "and reduce agent handling time for email."
                          ),
                      }
                  )

              # General pricing reminder
              recommendations.append(
                  {
                      "type": "channel_usage_general",
                      "severity": "info",
                      "detail": (
                          "Amazon Connect pricing varies by channel: Voice is per-minute, "
                          "Chat is per-message, Tasks are per-task, and Email is per-email. "
                          "Review your channel mix regularly to optimize costs."
                      ),
                  }
              )

              # Determine overall status
              warn_count = sum(1 for r in recommendations if r["severity"] == "warn")
              if warn_count > 0:
                  status = "warn"
                  detail = f"{warn_count} cost optimization opportunity(ies) identified"
              else:
                  status = "pass"
                  detail = "Channel mix reviewed — no significant cost concerns"

              return {
                  "channels": channels,
                  "total_created": total_created,
                  "total_handled": total_handled,
                  "voice_percentage": round(voice_pct, 1),
                  "chat_percentage": round(chat_pct, 1),
                  "recommendations": recommendations,
                  "status": status,
                  "detail": detail,
              }


          def analyze_telephony_usage(
              connect_client, instance_id, start_time, time_budget, event=None
          ):
              """Analyze telephony number inventory and usage patterns.

              Examines phone number types (DID, toll-free, etc.), country distribution,
              and provides recommendations for telephony cost optimization.

              Args:
                  connect_client: Boto3 Connect client (regional).
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  event (dict, optional): Full event payload for shared data lookup.

              Returns:
                  dict: Telephony usage findings with number inventory and recommendations.
              """
              check_time_budget(start_time, time_budget)

              phone_type_counts = {
                  "TOLL_FREE": 0,
                  "DID": 0,
                  "UIFN": 0,
                  "SHARED": 0,
                  "THIRD_PARTY_TF": 0,
                  "THIRD_PARTY_DID": 0,
                  "SHORT_CODE": 0,
              }
              country_counts = {}
              total_numbers = 0
              phone_numbers = []
              unused_phone_numbers = []

              # Fetch phone numbers via shared utility (QB-4)
              raw_numbers = fetch_phone_numbers(
                  connect_client, instance_id, start_time, time_budget, event
              )

              for number_summary in raw_numbers:
                  total_numbers += 1
                  phone_type = number_summary.get("PhoneNumberType", "UNKNOWN")
                  country_code = number_summary.get("PhoneNumberCountryCode", "UNKNOWN")
                  target_arn = number_summary.get("TargetArn", "")
                  phone_number_status = number_summary.get("PhoneNumberStatus", {})
                  status_value = (
                      phone_number_status.get("Status", "")
                      if isinstance(phone_number_status, dict)
                      else ""
                  )

                  if phone_type in phone_type_counts:
                      phone_type_counts[phone_type] += 1
                  country_counts[country_code] = country_counts.get(country_code, 0) + 1

                  phone_record = {
                      "phone_number": number_summary.get("PhoneNumber", ""),
                      "phone_number_country_code": country_code,
                      "phone_number_type": phone_type,
                      "target_arn": target_arn,
                      "phone_number_status": status_value,
                  }
                  phone_numbers.append(phone_record)

                  # Identify unused phone numbers: no target ARN or failed/in-progress status
                  if not target_arn or status_value in ("FAILED", "IN_PROGRESS"):
                      unused_phone_numbers.append(phone_record)

              # Generate telephony recommendations
              recommendations = []

              toll_free_count = phone_type_counts.get("TOLL_FREE", 0)
              did_count = phone_type_counts.get("DID", 0)

              if total_numbers > 0:
                  toll_free_pct = toll_free_count / total_numbers * 100
                  did_pct = did_count / total_numbers * 100
              else:
                  toll_free_pct = 0
                  did_pct = 0

              if toll_free_pct > 70 and total_numbers > 5:
                  recommendations.append(
                      {
                          "type": "telephony_toll_free_dominant",
                          "severity": "info",
                          "detail": (
                              f"Toll-free numbers represent {toll_free_pct:.0f}% of inventory. "
                              "While toll-free provides carrier redundancy, it comes at higher "
                              "per-minute cost compared to DIDs. Evaluate whether all numbers "
                              "require toll-free resiliency."
                          ),
                      }
                  )

              if did_count > 3 and len(country_counts) == 1:
                  recommendations.append(
                      {
                          "type": "telephony_single_country",
                          "severity": "info",
                          "detail": (
                              f"All {total_numbers} numbers are in a single country. "
                              "If serving international customers, consider local DIDs in "
                              "target countries to reduce caller costs."
                          ),
                      }
                  )

              if total_numbers > 20:
                  recommendations.append(
                      {
                          "type": "telephony_large_inventory",
                          "severity": "info",
                          "detail": (
                              f"Large phone number inventory ({total_numbers} numbers). "
                              "Each claimed number incurs a daily charge. Review whether all "
                              "numbers are actively used and release unused numbers."
                          ),
                      }
                  )

              if total_numbers == 0:
                  recommendations.append(
                      {
                          "type": "telephony_no_numbers",
                          "severity": "info",
                          "detail": "No phone numbers claimed for this instance.",
                      }
                  )

              # QB-65 / R2: emit warn when DIDs exist with zero toll-free (single-carrier
              # dependency, no redundancy). Analyzer now owns this status decision so the
              # renderer can flow the analyzer's status field verbatim to the badge — the
              # retained JSON and the HTML report agree on every input.
              if did_count > 0 and toll_free_count == 0:
                  recommendations.append(
                      {
                          "type": "telephony_no_toll_free_backup",
                          "severity": "warn",
                          "detail": (
                              f"{did_count} DIDs, 0 toll-free - consider toll-free for redundancy"
                          ),
                      }
                  )

              # Determine status — surface the strongest severity present in
              # recommendations so the renderer can flow status verbatim.
              if not recommendations:
                  status = "pass"
                  detail = f"Telephony inventory reviewed: {total_numbers} numbers"
              else:
                  severities = {r["severity"] for r in recommendations}
                  if "warn" in severities:
                      status = "warn"
                  else:
                      status = "pass"
                  detail = f"{total_numbers} numbers reviewed, {len(recommendations)} recommendation(s)"

              return {
                  "total_numbers": total_numbers,
                  "type_distribution": phone_type_counts,
                  "country_distribution": country_counts,
                  "countries_count": len(country_counts),
                  "toll_free_percentage": round(toll_free_pct, 1),
                  "did_percentage": round(did_pct, 1),
                  "phone_numbers": phone_numbers,
                  "unused_phone_numbers": unused_phone_numbers,
                  "recommendations": recommendations,
                  "status": status,
                  "detail": detail,
              }


          def analyze_usage_patterns(
              connect_client, cloudwatch_client, instance_id, days_back, start_time, time_budget
          ):
              """Analyze usage patterns to identify cost optimization opportunities.

              Examines daily contact volume patterns and peak/off-peak distribution
              to identify scheduling optimization opportunities.

              Args:
                  connect_client: Boto3 Connect client (regional).
                  cloudwatch_client: Boto3 CloudWatch client (regional).
                  instance_id (str): Connect instance ID.
                  days_back (int): Number of days to analyze.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Usage pattern findings with daily volumes and recommendations.
              """
              check_time_budget(start_time, time_budget)

              end_time_dt = datetime.now(timezone.utc)
              start_time_dt = end_time_dt - timedelta(days=days_back)

              # Get daily concurrent call metrics to understand usage patterns
              daily_volumes = []
              try:
                  resp = cloudwatch_client.get_metric_statistics(
                      Namespace="AWS/Connect",
                      MetricName="ConcurrentCalls",
                      Dimensions=[
                          {"Name": "InstanceId", "Value": instance_id},
                          {"Name": "MetricGroup", "Value": "VoiceCalls"},
                      ],
                      StartTime=start_time_dt,
                      EndTime=end_time_dt,
                      Period=86400,  # Daily granularity
                      Statistics=["Maximum", "Average", "Sum"],
                  )
                  for dp in sorted(resp.get("Datapoints", []), key=lambda x: x["Timestamp"]):
                      daily_volumes.append(
                          {
                              "date": dp["Timestamp"].strftime("%Y-%m-%d"),
                              "peak_concurrent": int(dp.get("Maximum", 0)),
                              "avg_concurrent": round(dp.get("Average", 0), 1),
                          }
                      )
              except ClientError as e:
                  logger.warning(f"Error fetching usage patterns: {e}")

              # Analyze patterns
              recommendations = []

              if daily_volumes:
                  peaks = [d["peak_concurrent"] for d in daily_volumes]
                  avgs = [d["avg_concurrent"] for d in daily_volumes]
                  max_peak = max(peaks) if peaks else 0
                  avg_peak = sum(peaks) / len(peaks) if peaks else 0
                  overall_avg = sum(avgs) / len(avgs) if avgs else 0

                  # High peak-to-average ratio suggests bursty traffic
                  if avg_peak > 0 and max_peak > avg_peak * 3:
                      recommendations.append(
                          {
                              "type": "usage_bursty_traffic",
                              "severity": "info",
                              "detail": (
                                  f"Peak concurrent calls ({max_peak}) is {max_peak / avg_peak:.1f}x "
                                  "the average peak. Bursty traffic patterns may benefit from "
                                  "callback queuing to smooth demand and reduce concurrent capacity needs."
                              ),
                          }
                      )

                  # Very low utilization
                  if overall_avg < 2 and len(daily_volumes) >= 7:
                      recommendations.append(
                          {
                              "type": "usage_low_volume",
                              "severity": "info",
                              "detail": (
                                  f"Average concurrent calls is {overall_avg:.1f}. "
                                  "Low volume instances may benefit from consolidation with "
                                  "other instances or reduced phone number inventory."
                              ),
                          }
                      )

                  status = "pass"
                  detail = f"Analyzed {len(daily_volumes)} days of usage data"
              else:
                  max_peak = 0
                  avg_peak = 0
                  overall_avg = 0
                  status = "info"
                  detail = "No usage pattern data available"

              return {
                  "daily_volumes": daily_volumes,
                  "days_analyzed": len(daily_volumes),
                  "max_peak_concurrent": max_peak,
                  "avg_peak_concurrent": round(avg_peak, 1),
                  "overall_avg_concurrent": round(overall_avg, 1),
                  "recommendations": recommendations,
                  "status": status,
                  "detail": detail,
              }


          def lambda_handler(event, context):
              """Cost Analyzer Lambda handler.

              Validates input using shared validate_input, analyzes channel usage,
              telephony inventory, and usage patterns with graceful timeout,
              persists results to S3 Hive-style path, and returns a standardized
              AnalyzerResult.

              Args:
                  event (dict): Input event with reviewId, instanceId, instanceArn,
                                accountId, awsRegion, daysBack, componentType,
                                s3ReportingBucket, and optional maxSeconds.
                  context: Lambda context object.

              Returns:
                  dict: Standardized AnalyzerResult (success or error).
              """
              logger.info("Cost Analyzer invoked")
              execution_start = time.time()

              # Validate required input fields using shared utility
              try:
                  validate_input(event)
              except ValueError as e:
                  logger.error(str(e))
                  return error_result(
                      event.get("componentType", "cost"),
                      str(e),
                  )

              instance_id = event["instanceId"]
              instance_arn = event["instanceArn"]
              account_id = event["accountId"]
              aws_region = event["awsRegion"]
              days_back = event["daysBack"]
              component_type = event["componentType"]

              # Accept maxSeconds from event payload (passed via analyzerTimeouts from PrepareContext)
              max_seconds = event.get("maxSeconds", DEFAULT_MAX_SECONDS)

              # Compute internal time budget using shared graceful timeout utility
              time_budget = compute_time_budget(max_seconds)

              logger.info(
                  f"Analyzing cost for instance={instance_id}, "
                  f"account={account_id}, region={aws_region}, "
                  f"days_back={days_back}, max_seconds={max_seconds}, time_budget={time_budget}"
              )

              connect_client = boto3.client("connect", region_name=aws_region)
              cloudwatch_client = boto3.client("cloudwatch", region_name=aws_region)
              checks_completed = []

              try:
                  # Check 1: Channel Usage and Cost Mix
                  channel_usage_raw = get_channel_usage(
                      connect_client,
                      instance_id,
                      instance_arn,
                      days_back,
                      execution_start,
                      time_budget,
                  )
                  channel_mix_findings = analyze_channel_mix(channel_usage_raw)
                  checks_completed.append("channel_mix")

                  # Check 2: Telephony Number Inventory
                  telephony_findings = analyze_telephony_usage(
                      connect_client,
                      instance_id,
                      execution_start,
                      time_budget,
                      event=event,
                  )
                  checks_completed.append("telephony_usage")

                  # Check 3: Usage Patterns
                  usage_pattern_findings = analyze_usage_patterns(
                      connect_client,
                      cloudwatch_client,
                      instance_id,
                      days_back,
                      execution_start,
                      time_budget,
                  )
                  checks_completed.append("usage_patterns")

                  findings = {
                      "channel_mix": channel_mix_findings,
                      "telephony_usage": telephony_findings,
                      "usage_patterns": usage_pattern_findings,
                      "checks_completed": checks_completed,
                      "days_back": days_back,
                      "timed_out": False,
                      "account_id": account_id,
                      "region": aws_region,
                  }

                  # Persist results to S3 Hive-style path before returning
                  s3_key = persist_to_s3(event, findings)

                  duration_ms = int((time.time() - execution_start) * 1000)

                  logger.info(f"Cost analysis complete: {len(checks_completed)} checks completed")

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                  )

              except TimeBudgetExceeded:
                  logger.info(
                      f"Cost Analyzer reached time budget after completing "
                      f"{len(checks_completed)} of 3 checks: {checks_completed}"
                  )

                  # Build partial findings from whatever checks completed
                  findings = {
                      "checks_completed": checks_completed,
                      "timed_out": True,
                      "account_id": account_id,
                      "region": aws_region,
                  }
                  if "channel_mix" in checks_completed:
                      findings["channel_mix"] = channel_mix_findings
                  if "telephony_usage" in checks_completed:
                      findings["telephony_usage"] = telephony_findings
                  if "usage_patterns" in checks_completed:
                      findings["usage_patterns"] = usage_pattern_findings

                  collected_count = len(checks_completed)
                  total_estimated = 3  # Total number of cost checks

                  # Persist partial results to S3 before returning
                  s3_key = persist_to_s3(
                      event,
                      findings,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

                  duration_ms = int((time.time() - execution_start) * 1000)

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

              except ClientError as e:
                  error_msg = str(e)
                  logger.error(f"AWS API error in Cost Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)
              except Exception as e:
                  error_msg = str(e)
                  logger.error(f"Unexpected error in Cost Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)

  # ---------------------------------------------------------------------------
  # Lambda Function — AI Analyzer
  # ---------------------------------------------------------------------------
  AIAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: AI features analysis — Q Connect agents, prompts, guardrails,
        knowledge bases
      FunctionName: ConnectOpsReview-AIAnalyzer
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt Boto3LayerCustomResourceV2.LayerVersionArn
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
          COMPONENT_TYPE: ai
      Code:
        ZipFile: |
          # AI Analyzer Lambda Function
          #
          # Standalone Lambda that performs AI/Q Connect analysis for Amazon Connect
          # instances, checking agent inventory, prompt configuration, guardrails,
          # domain encryption, and agent logging.
          # Extracted from the monolithic lambda_function.py as part of the
          # parallel orchestration architecture.
          #
          # Uses shared utilities from analyzer_common and graceful_timeout modules
          # for standardized input validation, result formatting, S3 persistence,
          # and time budget management.

          import boto3
          import logging
          import time
          from botocore.exceptions import ClientError

          from analyzer_common import (
              validate_input,
              success_result,
              error_result,
              persist_to_s3,
              discover_assistant_id,
              paginate_api_call,
          )
          from graceful_timeout import compute_time_budget, check_time_budget, TimeBudgetExceeded

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Default time budget if maxSeconds not provided in event payload
          DEFAULT_MAX_SECONDS = 540

          # Total number of AI checks (excluding assistant discovery)
          TOTAL_CHECKS = 5


          # ---------------------------------------------------------------------------
          # Check function stubs (full implementations in tasks 2.1–2.6)
          # ---------------------------------------------------------------------------


          def check_ai_agent_inventory(
              qconnect_client, connect_client, assistant_id, instance_id, start_time, time_budget
          ):
              """Check AI agent inventory and configuration.

              Args:
                  qconnect_client: boto3 QConnect client.
                  connect_client: boto3 Connect client.
                  assistant_id: The Q Connect assistant ID.
                  instance_id: The Connect instance ID.
                  start_time: Epoch timestamp when execution began.
                  time_budget: Allowed time budget in seconds.

              Returns:
                  dict: Structured finding with check_name, status, detail, recommendation, data.
                        data['_raw_agents'] contains the raw API agent list for reuse by other checks.
              """
              logger.info(
                  f"[O1] Starting AI Agent Inventory check for assistant_id={assistant_id}"
              )

              # List all AI agents
              check_time_budget(start_time, time_budget)
              agents = paginate_api_call(
                  qconnect_client.list_ai_agents,
                  "aiAgentSummaries",
                  start_time,
                  time_budget,
                  assistantId=assistant_id,
                  maxResults=100,
              )
              logger.info(f"[O1] list_ai_agents returned {len(agents)} agent(s)")

              if not agents:
                  logger.warning(f"[O1] No AI agents found for assistant {assistant_id}")
                  return {
                      "check_name": "agent_inventory",
                      "status": "info",
                      "detail": "No AI agents configured for this assistant.",
                      "recommendation": "Consider configuring AI agents to leverage Amazon Q in Connect capabilities.",
                      "data": {
                          "agent_count": 0,
                          "agents": [],
                          "mcp_heavy_agents": [],
                          "security_profiles_with_apps": 0,
                      },
                  }

              # Build security profile map with their MCP applications
              sp_apps_map = {}
              try:
                  check_time_budget(start_time, time_budget)
                  sp_resp = connect_client.list_security_profiles(
                      InstanceId=instance_id, MaxResults=100
                  )
                  for sp in sp_resp.get("SecurityProfileSummaryList", []):
                      check_time_budget(start_time, time_budget)
                      sp_id = sp["Id"]
                      sp_name = sp.get("Name", sp_id)
                      apps = []
                      try:
                          app_resp = connect_client.list_security_profile_applications(
                              InstanceId=instance_id, SecurityProfileId=sp_id, MaxResults=100
                          )
                          apps = app_resp.get("Applications", [])
                      except Exception:
                          pass
                      if apps:
                          sp_apps_map[sp_id] = {"name": sp_name, "apps": apps}
                          logger.info(
                              f"[O1] Security profile '{sp_name}' has {len(apps)} MCP app block(s)"
                          )
              except TimeBudgetExceeded:
                  raise
              except Exception as sp_err:
                  logger.warning(f"[O1] Could not list security profiles: {sp_err}")

              # Iterate over each agent to get details
              agents_data = []
              mcp_heavy_agents = []
              for idx, agent in enumerate(agents):
                  check_time_budget(start_time, time_budget)
                  a_id = agent.get("aiAgentId", "")

                  # Rate limiting: pause between consecutive get_ai_agent calls
                  if idx > 0:
                      time.sleep(0.3)

                  try:
                      check_time_budget(start_time, time_budget)
                      detail = qconnect_client.get_ai_agent(
                          assistantId=assistant_id, aiAgentId=a_id
                      )
                      ai_agent = detail.get("aiAgent", {})
                      name = ai_agent.get("name", "N/A")
                      a_type = ai_agent.get("type", "N/A")
                      status = agent.get("status", "N/A")

                      # Extract tools from configuration
                      config = ai_agent.get("configuration", {})
                      logger.info(f"[O1] Agent '{name}' config keys: {list(config.keys())}")
                      orch = config.get("orchestrationAIAgentConfiguration", {})
                      logger.info(f"[O1] Agent '{name}' orch keys: {list(orch.keys())}")
                      tools = orch.get("toolConfigurations", [])
                      logger.info(
                          f"[O1] Agent '{name}' has {len(tools)} tool(s) in toolConfigurations"
                      )

                      # Categorize tools
                      mcp_tools = []
                      builtin_tools = []
                      for t in tools:
                          t_type = t.get("toolType", "UNKNOWN")
                          t_name = t.get("toolName", t.get("title", "unknown"))
                          logger.debug(f"[O1]   Tool: type={t_type}, name={t_name}")
                          if t_type == "MODEL_CONTEXT_PROTOCOL":
                              mcp_tools.append(t_name)
                          else:
                              builtin_tools.append(t_name)

                      # Track MCP-heavy agents for sprawl insight
                      if len(mcp_tools) > 15:
                          mcp_heavy_agents.append({"name": name, "mcp_count": len(mcp_tools)})

                      # Find security profile - match by checking which profile has MCP apps
                      # whose namespace matches tools in this agent
                      matched_sp = None
                      agent_tool_ids = set()
                      for t in tools:
                          tid = t.get("toolId", "")
                          if tid:
                              agent_tool_ids.add(tid)
                              # Also extract namespace from toolId like "gateway_NAMESPACE__TARGET___op"
                              if "gateway_" in tid:
                                  ns = tid.split("__")[0].replace("gateway_", "")
                                  agent_tool_ids.add(ns)

                      if agent_tool_ids:
                          for sp_id, sp_info in sp_apps_map.items():
                              matched = False
                              for app in sp_info["apps"]:
                                  ns = app.get("Namespace", "")
                                  if ns and any(ns in tid for tid in agent_tool_ids):
                                      matched = True
                                      break
                              if matched:
                                  matched_sp = sp_info["name"]
                                  logger.info(
                                      f"[O1] Agent '{name}' matched security profile '{sp_info['name']}'"
                                  )
                                  break

                      logger.info(
                          f"[O1] Agent: {name}, mcp={len(mcp_tools)}, builtin={len(builtin_tools)}, sp={matched_sp}"
                      )

                      agents_data.append(
                          {
                              "name": name,
                              "type": a_type,
                              "status": status,
                              "mcp_tool_count": len(mcp_tools),
                              "builtin_tool_count": len(builtin_tools),
                              "tool_names": (mcp_tools + builtin_tools)[
                                  :20
                              ],  # Cap to avoid oversized payloads
                              "security_profile": matched_sp,
                          }
                      )

                  except TimeBudgetExceeded:
                      raise
                  except Exception as detail_err:
                      logger.warning(f"[O1] Failed to get detail for agent {a_id}: {detail_err}")
                      agents_data.append(
                          {
                              "name": agent.get("name", "N/A"),
                              "type": "N/A",
                              "status": agent.get("status", "N/A"),
                              "mcp_tool_count": 0,
                              "builtin_tool_count": 0,
                              "tool_names": [],
                              "security_profile": None,
                          }
                      )

              # Determine status and build detail string
              if mcp_heavy_agents:
                  status = "warn"
                  sprawl_parts = []
                  for a in mcp_heavy_agents:
                      severity = "CRITICAL" if a["mcp_count"] > 30 else "HIGH"
                      sprawl_parts.append(f"{a['name']}: {a['mcp_count']} MCP tools ({severity})")
                  detail = (
                      f"Found {len(agents)} AI agent(s). "
                      f"MCP Tool Sprawl detected - {len(mcp_heavy_agents)} agent(s) exceed 15 MCP tools: "
                      + "; ".join(sprawl_parts)
                  )
                  recommendation = (
                      "Consider creating role-specific security profiles per AI agent instead of one with all tools. "
                      "Reducing unused MCP tool permissions can improve response latency. "
                      "A larger tool space directly increases the tool-selection phase during each inference cycle."
                  )
              else:
                  status = "pass"
                  detail = f"Found {len(agents)} AI agent(s). No MCP tool sprawl issues detected."
                  recommendation = None

              # Truncate detail to 1024 chars
              if len(detail) > 1024:
                  detail = detail[:1021] + "..."

              return {
                  "check_name": "agent_inventory",
                  "status": status,
                  "detail": detail,
                  "recommendation": recommendation,
                  "data": {
                      "agent_count": len(agents),
                      "agents": agents_data,
                      "mcp_heavy_agents": mcp_heavy_agents,
                      "security_profiles_with_apps": len(sp_apps_map),
                      "_raw_agents": agents,  # Pass-through for reuse by guardrails check
                  },
              }


          def check_ai_prompt_configuration(
              qconnect_client, assistant_id, start_time, time_budget
          ):
              """Check AI prompt configuration and customization.

              Args:
                  qconnect_client: boto3 QConnect client.
                  assistant_id: The Q Connect assistant ID.
                  start_time: Epoch timestamp when execution began.
                  time_budget: Allowed time budget in seconds.

              Returns:
                  dict: Structured finding with check_name, status, detail, recommendation, data.
              """
              logger.info(
                  f"[O2] Starting AI Prompt Configuration check for assistant_id={assistant_id}"
              )
              try:
                  check_time_budget(start_time, time_budget)
                  prompts = paginate_api_call(
                      qconnect_client.list_ai_prompts,
                      "aiPromptSummaries",
                      start_time,
                      time_budget,
                      assistantId=assistant_id,
                      maxResults=100,
                  )
                  logger.info(f"[O2] list_ai_prompts returned {len(prompts)} prompt(s)")

                  if not prompts:
                      return {
                          "check_name": "prompt_configuration",
                          "status": "info",
                          "detail": "No AI prompts configured.",
                          "recommendation": "Consider configuring AI prompts to customize Amazon Q in Connect behavior.",
                          "data": {"prompt_count": 0, "prompts": [], "model_distribution": {}},
                      }

                  # Iterate over each prompt to get details
                  prompts_data = []
                  model_summary = {}
                  for idx, p in enumerate(prompts):
                      check_time_budget(start_time, time_budget)
                      p_id = p.get("aiPromptId", "")

                      # Rate limiting: pause between consecutive get_ai_prompt calls
                      if idx > 0:
                          time.sleep(0.3)

                      try:
                          check_time_budget(start_time, time_budget)
                          detail_resp = qconnect_client.get_ai_prompt(
                              assistantId=assistant_id, aiPromptId=p_id
                          )
                          prompt_detail = detail_resp.get("aiPrompt", {})
                          name = prompt_detail.get("name", "N/A")
                          p_type = prompt_detail.get("type", "N/A")
                          model_id = prompt_detail.get("modelId", "N/A")
                          template_config = prompt_detail.get("templateConfiguration", {})
                      except TimeBudgetExceeded:
                          raise
                      except Exception:
                          name = p.get("name", "N/A")
                          p_type = "N/A"
                          model_id = "N/A"
                          template_config = {}

                      # Extract template text for completeness validation
                      template_text = ""
                      if template_config:
                          # TEXT type: templateConfiguration.textFullAIPromptEditTemplateConfiguration.text
                          text_config = template_config.get(
                              "textFullAIPromptEditTemplateConfiguration", {}
                          )
                          template_text = text_config.get("text", "")

                      # Track model distribution
                      short_model = model_id.split(":")[0] if ":" in model_id else model_id
                      model_summary[short_model] = model_summary.get(short_model, 0) + 1

                      prompts_data.append(
                          {
                              "name": name,
                              "type": p_type,
                              "model_id": model_id,
                              "has_template_text": bool(template_text and template_text.strip()),
                          }
                      )

                  # Check prompt completeness - identify prompts with missing/empty template text
                  incomplete_prompts = [
                      p for p in prompts_data if not p.get("has_template_text", False)
                  ]

                  # Build model distribution summary string for detail
                  model_parts = []
                  for model, count in sorted(
                      model_summary.items(), key=lambda x: x[1], reverse=True
                  ):
                      model_parts.append(f"{model}: {count}")
                  model_dist_str = ", ".join(model_parts)

                  if incomplete_prompts:
                      # Some prompts are missing system prompt / have empty instruction
                      incomplete_names = [p["name"] for p in incomplete_prompts]
                      detail = (
                          f"Found {len(prompts)} AI prompt(s). "
                          f"{len(incomplete_prompts)} prompt(s) missing system prompt or have empty instruction: "
                          + ", ".join(incomplete_names)
                          + f". Model distribution: {model_dist_str}"
                      )
                      recommendation = (
                          "Review and configure system prompts for all AI prompts. "
                          "Each prompt should have substantive instruction text to guide AI behavior. "
                          "Empty or missing prompts may result in generic or unpredictable responses."
                      )
                      status = "warn"
                  else:
                      # All prompts are complete
                      detail = f"Found {len(prompts)} AI prompt(s), all with valid configurations. Model distribution: {model_dist_str}"
                      recommendation = None
                      status = "pass"

                  # Truncate detail to 1024 chars
                  if len(detail) > 1024:
                      detail = detail[:1021] + "..."

                  return {
                      "check_name": "prompt_configuration",
                      "status": status,
                      "detail": detail,
                      "recommendation": recommendation,
                      "data": {
                          "prompt_count": len(prompts),
                          "prompts": prompts_data,
                          "model_distribution": model_summary,
                          "incomplete_prompts": [p["name"] for p in incomplete_prompts],
                      },
                  }
              except TimeBudgetExceeded:
                  raise
              except Exception as e:
                  logger.error(f"[O2] Error: {e}")
                  error_detail = f"Error retrieving AI prompt configuration: {str(e)}"
                  if len(error_detail) > 1024:
                      error_detail = error_detail[:1021] + "..."
                  return {
                      "check_name": "prompt_configuration",
                      "status": "error",
                      "detail": error_detail,
                      "recommendation": None,
                      "data": None,
                  }


          def check_q_guardrails(
              qconnect_client, assistant_id, start_time, time_budget, cached_agents=None
          ):
              """Check Q Connect guardrail configuration and coverage.

              Args:
                  qconnect_client: boto3 QConnect client.
                  assistant_id: The Q Connect assistant ID.
                  start_time: Epoch timestamp when execution began.
                  time_budget: Allowed time budget in seconds.
                  cached_agents: Optional pre-fetched agents list to avoid redundant API call.

              Returns:
                  dict: Structured finding with check_name, status, detail, recommendation, data.
              """
              logger.info(f"[S1] Starting Q Guardrails check for assistant_id={assistant_id}")
              try:
                  # --- Part 1: List and analyze guardrail configurations ---
                  check_time_budget(start_time, time_budget)
                  guardrails = paginate_api_call(
                      qconnect_client.list_ai_guardrails,
                      "aiGuardrailSummaries",
                      start_time,
                      time_budget,
                      assistantId=assistant_id,
                      maxResults=100,
                  )
                  logger.info(f"[S1] list_ai_guardrails returned {len(guardrails)} guardrail(s)")

                  if not guardrails:
                      return {
                          "check_name": "guardrails",
                          "status": "info",
                          "detail": "No guardrails configured for this assistant.",
                          "recommendation": "Consider configuring AI guardrails if using Amazon Q in Connect agents.",
                          "data": {
                              "guardrail_count": 0,
                              "published_count": 0,
                              "guardrail_details": [],
                              "missing_filters": [],
                              "total_agents": 0,
                              "agents_with_guardrail_published": 0,
                              "agents_with_guardrail_draft_only": 0,
                              "agents_without_guardrail": 0,
                              "unprotected_agents": [],
                          },
                      }

                  published = [g for g in guardrails if g.get("visibilityStatus") == "PUBLISHED"]

                  # Get detailed config for each guardrail to check filter coverage
                  guardrail_details = []
                  for idx, g in enumerate(guardrails):
                      check_time_budget(start_time, time_budget)
                      g_id = g.get("aiGuardrailId", "")

                      # Rate limiting between consecutive get_ai_guardrail calls
                      if idx > 0:
                          time.sleep(0.3)

                      detail = {}
                      try:
                          check_time_budget(start_time, time_budget)
                          resp = qconnect_client.get_ai_guardrail(
                              assistantId=assistant_id, aiGuardrailId=g_id
                          )
                          detail = resp.get("aiGuardrail", {})
                          logger.info(
                              f"[S1] Guardrail '{g.get('name')}' detail keys: {list(detail.keys())}"
                          )
                      except TimeBudgetExceeded:
                          raise
                      except Exception as gd_err:
                          logger.warning(
                              f"[S1] Could not get detail for guardrail {g_id}: {gd_err}"
                          )

                      # Check which filter types are configured
                      has_content_filter = bool(
                          detail.get("contentPolicyConfig", {}).get("filtersConfig", [])
                      )
                      has_topic_policy = bool(
                          detail.get("topicPolicyConfig", {}).get("topicsConfig", [])
                      )
                      has_pii_filter = bool(
                          detail.get("sensitiveInformationPolicyConfig", {}).get(
                              "piiEntitiesConfig", []
                          )
                          or detail.get("sensitiveInformationPolicyConfig", {}).get(
                              "regexesConfig", []
                          )
                      )
                      has_word_filter = bool(
                          detail.get("wordPolicyConfig", {}).get("wordsConfig", [])
                          or detail.get("wordPolicyConfig", {}).get("managedWordListsConfig", [])
                      )
                      has_grounding = bool(
                          detail.get("contextualGroundingPolicyConfig", {}).get(
                              "filtersConfig", []
                          )
                      )

                      guardrail_details.append(
                          {
                              "name": g.get("name", "N/A"),
                              "id": g_id,
                              "status": g.get("status", "N/A"),
                              "visibility": g.get("visibilityStatus", "N/A"),
                              "content_filter": has_content_filter,
                              "topic_policy": has_topic_policy,
                              "pii_filter": has_pii_filter,
                              "word_filter": has_word_filter,
                              "grounding": has_grounding,
                          }
                      )

                  # Check for missing critical filters on PUBLISHED guardrails
                  missing_filters = []
                  for gd in guardrail_details:
                      if gd["visibility"] == "PUBLISHED":
                          if not gd["content_filter"]:
                              missing_filters.append(f"'{gd['name']}' missing Content Filter")
                          if not gd["pii_filter"]:
                              missing_filters.append(f"'{gd['name']}' missing PII Filter")
                          if not gd["topic_policy"]:
                              missing_filters.append(f"'{gd['name']}' missing Denied Topics")
                          if not gd["grounding"]:
                              missing_filters.append(
                                  f"'{gd['name']}' missing Contextual Grounding"
                              )

                  # --- Part 2: Check which AI agents have guardrails associated ---
                  check_time_budget(start_time, time_budget)
                  if cached_agents is not None:
                      agents = cached_agents
                      logger.info(
                          f"[S1] Using cached agents list ({len(agents)} agent(s)) for guardrail cross-reference"
                      )
                  else:
                      agents = paginate_api_call(
                          qconnect_client.list_ai_agents,
                          "aiAgentSummaries",
                          start_time,
                          time_budget,
                          assistantId=assistant_id,
                          maxResults=100,
                      )
                      logger.info(
                          f"[S1] list_ai_agents returned {len(agents)} agent(s) for guardrail cross-reference"
                      )

                  agents_with_guardrail_published = []
                  agents_with_guardrail_draft_only = []
                  agents_without_guardrail = []

                  for idx, agent in enumerate(agents):
                      check_time_budget(start_time, time_budget)
                      a_id = agent.get("aiAgentId", "")
                      a_name = agent.get("name", "N/A")
                      a_visibility = agent.get("visibilityStatus", "")

                      # Rate limiting between consecutive get_ai_agent calls
                      if idx > 0:
                          time.sleep(0.3)

                      try:
                          check_time_budget(start_time, time_budget)
                          latest_resp = qconnect_client.get_ai_agent(
                              assistantId=assistant_id, aiAgentId=a_id
                          )
                          latest_agent = latest_resp.get("aiAgent", {})

                          # Extract guardrail ID from agent configuration
                          config = latest_agent.get("configuration", {})
                          orch = config.get("orchestrationAIAgentConfiguration", {})
                          guardrail_id = orch.get("orchestrationAIGuardrailId", "")
                          if not guardrail_id:
                              guardrail_id = orch.get("guardrailId", "")
                          if not guardrail_id:
                              ss = config.get("selfServiceAIAgentConfiguration", {})
                              guardrail_id = ss.get("orchestrationAIGuardrailId", "") or ss.get(
                                  "guardrailId", ""
                              )

                          logger.info(
                              f"[S1] Agent '{a_name}': guardrail='{guardrail_id}', "
                              f"agent_visibility={a_visibility}"
                          )

                          # Categorize based on guardrail presence and agent visibility
                          if guardrail_id and a_visibility == "PUBLISHED":
                              agents_with_guardrail_published.append(
                                  {
                                      "name": a_name,
                                      "guardrail_id": guardrail_id,
                                      "status": "PUBLISHED",
                                  }
                              )
                          elif guardrail_id:
                              agents_with_guardrail_draft_only.append(
                                  {
                                      "name": a_name,
                                      "guardrail_id": guardrail_id,
                                      "status": "DRAFT ONLY",
                                  }
                              )
                          else:
                              agents_without_guardrail.append(a_name)
                      except TimeBudgetExceeded:
                          raise
                      except Exception as agent_err:
                          logger.warning(f"[S1] Error checking agent {a_name}: {agent_err}")
                          agents_without_guardrail.append(a_name)

                  total_agents = len(agents)
                  pub_protected = len(agents_with_guardrail_published)
                  draft_only = len(agents_with_guardrail_draft_only)
                  unprotected = len(agents_without_guardrail)

                  # --- Determine status ---
                  if not published:
                      status = "fail"
                      detail = (
                          f"No published AI guardrails found (total: {len(guardrails)}, published: 0). "
                          f"PII protection and content filtering are not active."
                      )
                      recommendation = (
                          "Deploy at least one guardrail with all five filter types enabled "
                          "(Content Filter, Denied Topics, PII Filter, Word Filter, Contextual Grounding)."
                      )
                  elif missing_filters or draft_only > 0 or unprotected > 0:
                      status = "warn"
                      parts = []
                      parts.append(
                          f"Total guardrails: {len(guardrails)}, Published: {len(published)}."
                      )
                      if missing_filters:
                          parts.append(f"Missing filters: {'; '.join(missing_filters[:5])}")
                          if len(missing_filters) > 5:
                              parts.append(f"(+{len(missing_filters) - 5} more)")
                      if draft_only > 0:
                          parts.append(
                              f"{draft_only} agent(s) have guardrails in draft state only."
                          )
                      if unprotected > 0:
                          parts.append(f"{unprotected} agent(s) have no guardrail configured.")
                      detail = " ".join(parts)
                      rec_parts = []
                      if missing_filters:
                          rec_parts.append("Add missing filter types to published guardrails.")
                      if draft_only > 0:
                          rec_parts.append(
                              "Publish agent versions to activate guardrail protection."
                          )
                      if unprotected > 0:
                          rec_parts.append(
                              "Configure guardrails in unprotected agents orchestration settings."
                          )
                      recommendation = " ".join(rec_parts)
                  else:
                      status = "pass"
                      detail = (
                          f"Total guardrails: {len(guardrails)}, Published: {len(published)}. "
                          f"All published guardrails have full filter coverage. "
                          f"All {total_agents} agent(s) have published guardrails."
                      )
                      recommendation = None

                  # Truncate detail and recommendation to 1024 chars
                  if len(detail) > 1024:
                      detail = detail[:1021] + "..."
                  if recommendation and len(recommendation) > 1024:
                      recommendation = recommendation[:1021] + "..."

                  return {
                      "check_name": "guardrails",
                      "status": status,
                      "detail": detail,
                      "recommendation": recommendation,
                      "data": {
                          "guardrail_count": len(guardrails),
                          "published_count": len(published),
                          "guardrail_details": guardrail_details,
                          "missing_filters": missing_filters,
                          "total_agents": total_agents,
                          "agents_with_guardrail_published": pub_protected,
                          "agents_with_guardrail_draft_only": draft_only,
                          "agents_without_guardrail": unprotected,
                          "unprotected_agents": agents_without_guardrail,
                      },
                  }
              except TimeBudgetExceeded:
                  raise
              except Exception as e:
                  logger.error(f"[S1] Error: {e}")
                  error_detail = f"Error checking guardrails: {str(e)}"
                  if len(error_detail) > 1024:
                      error_detail = error_detail[:1021] + "..."
                  return {
                      "check_name": "guardrails",
                      "status": "error",
                      "detail": error_detail,
                      "recommendation": None,
                      "data": None,
                  }


          def check_q_domain_encryption(qconnect_client, assistant_id, start_time, time_budget):
              """Check Q Connect domain encryption configuration.

              Uses the GetAssistant API to determine whether a customer-managed KMS key
              is configured for the Amazon Connect AI Agents domain.

              Args:
                  qconnect_client: boto3 QConnect client.
                  assistant_id: The Q Connect assistant ID.
                  start_time: Epoch timestamp when execution began.
                  time_budget: Allowed time budget in seconds.

              Returns:
                  dict: Structured finding with check_name, status, detail, recommendation, data.
              """
              logger.info(
                  f"[S2] Starting Domain Encryption check for assistant_id={assistant_id}"
              )
              try:
                  check_time_budget(start_time, time_budget)
                  response = qconnect_client.get_assistant(assistantId=assistant_id)
                  assistant = response.get("assistant", {})
                  logger.info(
                      f"[S2] get_assistant returned: name={assistant.get('name', 'N/A')}, "
                      f"status={assistant.get('status', 'N/A')}, type={assistant.get('type', 'N/A')}"
                  )

                  enc_config = assistant.get("serverSideEncryptionConfiguration", {})
                  kms_key = enc_config.get("kmsKeyId", "")

                  if kms_key:
                      # Mask the key for display (keep first 40 chars if longer)
                      masked_key = kms_key[:40] + "..." if len(kms_key) > 40 else kms_key
                      detail = f"Customer-managed KMS key configured: {masked_key}"
                      return {
                          "check_name": "domain_encryption",
                          "status": "pass",
                          "detail": detail,
                          "recommendation": None,
                          "data": {"has_cmk": True, "kms_key_id": masked_key},
                      }
                  else:
                      detail = "Using AWS-owned encryption key (no customer-managed KMS key)."
                      recommendation = (
                          "Configure a customer-managed KMS key for the Amazon Connect AI Agents domain "
                          "to enable key rotation auditing and access control."
                      )
                      return {
                          "check_name": "domain_encryption",
                          "status": "warn",
                          "detail": detail,
                          "recommendation": recommendation,
                          "data": {"has_cmk": False, "kms_key_id": None},
                      }
              except TimeBudgetExceeded:
                  raise
              except Exception as e:
                  logger.error(f"[S2] Error: {e}")
                  error_detail = f"Error checking domain encryption: {str(e)}"
                  if len(error_detail) > 1024:
                      error_detail = error_detail[:1021] + "..."
                  return {
                      "check_name": "domain_encryption",
                      "status": "error",
                      "detail": error_detail,
                      "recommendation": None,
                      "data": None,
                  }


          def check_ai_agent_logging(
              logs_client, assistant_id, account_id, aws_region, start_time, time_budget
          ):
              """Check AI agent logging configuration via CloudWatch delivery destinations.

              Args:
                  logs_client: boto3 CloudWatch Logs client.
                  assistant_id: The Q Connect assistant ID.
                  account_id: The AWS account ID.
                  aws_region: The AWS region.
                  start_time: Epoch timestamp when execution began.
                  time_budget: Allowed time budget in seconds.

              Returns:
                  dict: Structured finding with check_name, status, detail, recommendation, data.
              """
              logger.info(
                  f"[O5] Starting AI Agent Logging check for assistant_id={assistant_id}, account={account_id}, region={aws_region}"
              )
              try:
                  assistant_arn = (
                      f"arn:aws:wisdom:{aws_region}:{account_id}:assistant/{assistant_id}"
                  )
                  logger.info(f"[O5] Constructed assistant ARN: {assistant_arn}")

                  check_time_budget(start_time, time_budget)
                  response = logs_client.describe_deliveries()
                  deliveries = response.get("deliveries", [])
                  logger.info(
                      f"[O5] describe_deliveries returned {len(deliveries)} total delivery/deliveries"
                  )

                  # Match by checking if assistant_id appears in source name OR by checking delivery source ARNs
                  matching = []
                  for d in deliveries:
                      source_name = d.get("deliverySourceName", "")
                      # Check direct assistant_id match in source name
                      if assistant_id in source_name:
                          matching.append(d)
                      # Also check for wisdom/qconnect delivery sources (WdDeliverySource pattern)
                      elif (
                          "WdDeliverySource" in source_name
                          or "wisdom" in source_name.lower()
                          or "qconnect" in source_name.lower()
                      ):
                          try:
                              check_time_budget(start_time, time_budget)
                              source_detail = logs_client.describe_delivery_sources()
                              for src in source_detail.get("deliverySources", []):
                                  if src.get("name") == source_name and assistant_id in src.get(
                                      "resourceArn", ""
                                  ):
                                      matching.append(d)
                                      logger.info(
                                          f"[O5] Matched delivery via source ARN: {src.get('resourceArn')}"
                                      )
                                      break
                          except TimeBudgetExceeded:
                              raise
                          except Exception as src_err:
                              logger.debug(
                                  f"[O5] Could not check delivery source detail: {src_err}"
                              )

                  logger.info(
                      f"[O5] Found {len(matching)} delivery/deliveries matching assistant_id={assistant_id}"
                  )

                  if matching:
                      delivery_info = []
                      for d in matching:
                          delivery_info.append(
                              {
                                  "id": d.get("id", "N/A"),
                                  "source": d.get("deliverySourceName", "N/A"),
                                  "destination_type": d.get("deliveryDestinationType", "N/A"),
                              }
                          )
                      detail = f"CloudWatch log delivery configured ({len(matching)} delivery/deliveries found)."
                      if len(detail) > 1024:
                          detail = detail[:1021] + "..."
                      return {
                          "check_name": "agent_logging",
                          "status": "pass",
                          "detail": detail,
                          "recommendation": None,
                          "data": {
                              "deliveries_found": len(matching),
                              "deliveries": delivery_info,
                              "assistant_arn": assistant_arn,
                          },
                      }
                  else:
                      detail = (
                          "No CloudWatch Vended Logs delivery configured for AI Agent event logs. "
                          "This checks for AI Agent-specific event log delivery "
                          "(TRANSCRIPT_AGENTIC_MESSAGE, TRANSCRIPT_SELF_SERVICE_MESSAGE, etc.), "
                          "not standard Connect contact flow logging which may be enabled separately "
                          "at the instance level."
                      )
                      recommendation = (
                          "Configure CloudWatch Vended Logs delivery for your AI Agent to capture "
                          "event logs including TRANSCRIPT_AGENTIC_MESSAGE and TRANSCRIPT_SELF_SERVICE_MESSAGE. "
                          "Additionally, use the ListSpans API as a starting point for debugging AI agent interactions."
                      )
                      if len(detail) > 1024:
                          detail = detail[:1021] + "..."
                      return {
                          "check_name": "agent_logging",
                          "status": "warn",
                          "detail": detail,
                          "recommendation": recommendation,
                          "data": {
                              "deliveries_found": 0,
                              "deliveries": [],
                              "assistant_arn": assistant_arn,
                          },
                      }
              except TimeBudgetExceeded:
                  raise
              except Exception as e:
                  logger.error(f"[O5] Error: {e}")
                  error_detail = f"Error checking AI agent logging: {str(e)}"
                  if len(error_detail) > 1024:
                      error_detail = error_detail[:1021] + "..."
                  return {
                      "check_name": "agent_logging",
                      "status": "error",
                      "detail": error_detail,
                      "recommendation": None,
                      "data": None,
                  }


          # ---------------------------------------------------------------------------
          # Lambda Handler
          # ---------------------------------------------------------------------------


          def lambda_handler(event, context):
              """AI Analyzer Lambda handler.

              Validates input using shared validate_input, discovers the Q Connect
              assistant, runs AI-specific checks with graceful timeout, persists
              results to S3 Hive-style path, and returns a standardized AnalyzerResult.

              Args:
                  event (dict): Input event with reviewId, instanceId, instanceArn,
                                accountId, awsRegion, daysBack, componentType,
                                s3ReportingBucket, and optional maxSeconds.
                  context: Lambda context object.

              Returns:
                  dict: Standardized AnalyzerResult (success or error).
              """
              logger.info("AI Analyzer invoked")
              start_time = time.time()
              component_type = event.get("componentType", "ai")

              # 1. Validate required input fields using shared utility
              try:
                  validate_input(event)
              except ValueError as e:
                  logger.error(str(e))
                  return error_result(component_type, str(e))

              # 2. Extract fields from validated event
              instance_id = event["instanceId"]
              account_id = event["accountId"]
              aws_region = event["awsRegion"]

              # 3. Compute time budget
              max_seconds = event.get("maxSeconds", DEFAULT_MAX_SECONDS)
              time_budget = compute_time_budget(max_seconds)

              logger.info(
                  f"Analyzing AI features for instance={instance_id}, "
                  f"account={account_id}, region={aws_region}, "
                  f"max_seconds={max_seconds}, time_budget={time_budget}"
              )

              # 4. Initialize pillar-keyed findings structure
              findings = {
                  "security": [],
                  "operational_excellence": [],
                  "resilience": [],
                  "observability": [],
                  "metadata": {
                      "assistant_id": None,
                      "checks_completed": [],
                      "timed_out": False,
                      "account_id": account_id,
                      "region": aws_region,
                  },
              }

              # 5. Create boto3 clients
              connect_client = boto3.client("connect", region_name=aws_region)
              qconnect_client = boto3.client("qconnect", region_name=aws_region)
              logs_client = boto3.client("logs", region_name=aws_region)

              try:
                  # 6. Discover assistant ID (gate for all subsequent checks)
                  assistant_id = discover_assistant_id(
                      connect_client, instance_id, start_time, time_budget, event=event
                  )
                  findings["metadata"]["assistant_id"] = assistant_id

                  # Short-circuit if no assistant found
                  if assistant_id is None:
                      logger.info(f"No Q Connect assistant found for instance={instance_id}")
                      findings["operational_excellence"].append(
                          {
                              "check_name": "assistant_discovery",
                              "status": "info",
                              "detail": "No Amazon Q in Connect assistant is configured for this instance.",
                              "recommendation": "Consider enabling Amazon Q in Connect to leverage AI-powered agent assistance.",
                              "data": None,
                          }
                      )
                      findings["metadata"]["checks_completed"].append("assistant_discovery")

                      # Persist and return success
                      try:
                          s3_key = persist_to_s3(event, findings)
                      except Exception as e:
                          logger.error(f"Failed to persist AI findings to S3: {e}")
                          return error_result(component_type, f"S3 persistence failed: {str(e)}")

                      duration_ms = int((time.time() - start_time) * 1000)
                      return success_result(
                          component_type,
                          findings,
                          duration_ms=duration_ms,
                          s3_key=s3_key,
                      )

                  logger.info(f"Discovered assistant_id={assistant_id}")
                  findings["metadata"]["checks_completed"].append("assistant_discovery")

                  # 7. Run checks sequentially with per-check error isolation

                  # Check 1: AI Agent Inventory → operational_excellence
                  # Also captures the agents list for reuse in guardrails check
                  cached_agents = None
                  try:
                      check_time_budget(start_time, time_budget)
                      result = check_ai_agent_inventory(
                          qconnect_client,
                          connect_client,
                          assistant_id,
                          instance_id,
                          start_time,
                          time_budget,
                      )
                      # Cache the raw agents count for guardrails cross-reference
                      cached_agents = (
                          result.get("data", {}).get("_raw_agents")
                          if result.get("data")
                          else None
                      )
                      findings["operational_excellence"].append(result)
                      findings["metadata"]["checks_completed"].append("agent_inventory")
                  except ClientError as e:
                      error_code = e.response.get("Error", {}).get("Code", "")
                      if error_code in ("AccessDeniedException", "ResourceNotFoundException"):
                          logger.warning(f"agent_inventory skipped due to {error_code}: {e}")
                          findings["operational_excellence"].append(
                              {
                                  "check_name": "agent_inventory",
                                  "status": "info",
                                  "detail": f"Check skipped: {error_code}",
                                  "recommendation": None,
                                  "data": {"error_code": error_code},
                              }
                          )
                      else:
                          raise
                  except TimeBudgetExceeded:
                      raise
                  except Exception as e:
                      logger.error(f"Unexpected error in agent_inventory: {e}")
                      findings["operational_excellence"].append(
                          {
                              "check_name": "agent_inventory",
                              "status": "error",
                              "detail": f"Check failed: {str(e)[:1024]}",
                              "recommendation": None,
                              "data": None,
                          }
                      )

                  # Check 2: AI Prompt Configuration → operational_excellence
                  try:
                      check_time_budget(start_time, time_budget)
                      result = check_ai_prompt_configuration(
                          qconnect_client,
                          assistant_id,
                          start_time,
                          time_budget,
                      )
                      findings["operational_excellence"].append(result)
                      findings["metadata"]["checks_completed"].append("prompt_configuration")
                  except ClientError as e:
                      error_code = e.response.get("Error", {}).get("Code", "")
                      if error_code in ("AccessDeniedException", "ResourceNotFoundException"):
                          logger.warning(f"prompt_configuration skipped due to {error_code}: {e}")
                          findings["operational_excellence"].append(
                              {
                                  "check_name": "prompt_configuration",
                                  "status": "info",
                                  "detail": f"Check skipped: {error_code}",
                                  "recommendation": None,
                                  "data": {"error_code": error_code},
                              }
                          )
                      else:
                          raise
                  except TimeBudgetExceeded:
                      raise
                  except Exception as e:
                      logger.error(f"Unexpected error in prompt_configuration: {e}")
                      findings["operational_excellence"].append(
                          {
                              "check_name": "prompt_configuration",
                              "status": "error",
                              "detail": f"Check failed: {str(e)[:1024]}",
                              "recommendation": None,
                              "data": None,
                          }
                      )

                  # Check 3: Q Guardrails → security
                  try:
                      check_time_budget(start_time, time_budget)
                      result = check_q_guardrails(
                          qconnect_client,
                          assistant_id,
                          start_time,
                          time_budget,
                          cached_agents=cached_agents,
                      )
                      findings["security"].append(result)
                      findings["metadata"]["checks_completed"].append("guardrails")
                  except ClientError as e:
                      error_code = e.response.get("Error", {}).get("Code", "")
                      if error_code in ("AccessDeniedException", "ResourceNotFoundException"):
                          logger.warning(f"guardrails skipped due to {error_code}: {e}")
                          findings["security"].append(
                              {
                                  "check_name": "guardrails",
                                  "status": "info",
                                  "detail": f"Check skipped: {error_code}",
                                  "recommendation": None,
                                  "data": {"error_code": error_code},
                              }
                          )
                      else:
                          raise
                  except TimeBudgetExceeded:
                      raise
                  except Exception as e:
                      logger.error(f"Unexpected error in guardrails: {e}")
                      findings["security"].append(
                          {
                              "check_name": "guardrails",
                              "status": "error",
                              "detail": f"Check failed: {str(e)[:1024]}",
                              "recommendation": None,
                              "data": None,
                          }
                      )

                  # Check 4: Q Domain Encryption → security
                  try:
                      check_time_budget(start_time, time_budget)
                      result = check_q_domain_encryption(
                          qconnect_client,
                          assistant_id,
                          start_time,
                          time_budget,
                      )
                      findings["security"].append(result)
                      findings["metadata"]["checks_completed"].append("domain_encryption")
                  except ClientError as e:
                      error_code = e.response.get("Error", {}).get("Code", "")
                      if error_code in ("AccessDeniedException", "ResourceNotFoundException"):
                          logger.warning(f"domain_encryption skipped due to {error_code}: {e}")
                          findings["security"].append(
                              {
                                  "check_name": "domain_encryption",
                                  "status": "info",
                                  "detail": f"Check skipped: {error_code}",
                                  "recommendation": None,
                                  "data": {"error_code": error_code},
                              }
                          )
                      else:
                          raise
                  except TimeBudgetExceeded:
                      raise
                  except Exception as e:
                      logger.error(f"Unexpected error in domain_encryption: {e}")
                      findings["security"].append(
                          {
                              "check_name": "domain_encryption",
                              "status": "error",
                              "detail": f"Check failed: {str(e)[:1024]}",
                              "recommendation": None,
                              "data": None,
                          }
                      )

                  # Check 5: AI Agent Logging → observability
                  try:
                      check_time_budget(start_time, time_budget)
                      result = check_ai_agent_logging(
                          logs_client,
                          assistant_id,
                          account_id,
                          aws_region,
                          start_time,
                          time_budget,
                      )
                      findings["observability"].append(result)
                      findings["metadata"]["checks_completed"].append("agent_logging")
                  except ClientError as e:
                      error_code = e.response.get("Error", {}).get("Code", "")
                      if error_code in ("AccessDeniedException", "ResourceNotFoundException"):
                          logger.warning(f"agent_logging skipped due to {error_code}: {e}")
                          findings["observability"].append(
                              {
                                  "check_name": "agent_logging",
                                  "status": "info",
                                  "detail": f"Check skipped: {error_code}",
                                  "recommendation": None,
                                  "data": {"error_code": error_code},
                              }
                          )
                      else:
                          raise
                  except TimeBudgetExceeded:
                      raise
                  except Exception as e:
                      logger.error(f"Unexpected error in agent_logging: {e}")
                      findings["observability"].append(
                          {
                              "check_name": "agent_logging",
                              "status": "error",
                              "detail": f"Check failed: {str(e)[:1024]}",
                              "recommendation": None,
                              "data": None,
                          }
                      )

              except TimeBudgetExceeded:
                  logger.info(
                      f"AI Analyzer reached time budget after completing "
                      f"{len(findings['metadata']['checks_completed'])} checks: "
                      f"{findings['metadata']['checks_completed']}"
                  )
                  findings["metadata"]["timed_out"] = True

                  collected_count = len(findings["metadata"]["checks_completed"])
                  total_estimated = TOTAL_CHECKS + 1  # checks + assistant discovery

                  # Persist partial results
                  try:
                      s3_key = persist_to_s3(
                          event,
                          findings,
                          partial=True,
                          collected_count=collected_count,
                          total_estimated=total_estimated,
                      )
                  except Exception as e:
                      logger.error(f"Failed to persist partial AI findings to S3: {e}")
                      return error_result(component_type, f"S3 persistence failed: {str(e)}")

                  duration_ms = int((time.time() - start_time) * 1000)
                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

              # 8. Persist full results to S3
              try:
                  s3_key = persist_to_s3(event, findings)
              except Exception as e:
                  logger.error(f"Failed to persist AI findings to S3: {e}")
                  return error_result(component_type, f"S3 persistence failed: {str(e)}")

              duration_ms = int((time.time() - start_time) * 1000)
              checks_completed = findings["metadata"]["checks_completed"]

              logger.info(
                  f"AI analysis complete: {len(checks_completed)} checks completed in {duration_ms}ms"
              )

              return success_result(
                  component_type,
                  findings,
                  duration_ms=duration_ms,
                  s3_key=s3_key,
              )

  # ---------------------------------------------------------------------------
  # Lambda Function — Report Generator
  # ---------------------------------------------------------------------------
  ReportGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Assembles HTML report from analyzer results
      FunctionName: ConnectOpsReview-ReportGenerator
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
          DEVOPS_AGENT_AGENT_SPACE_ID: !Ref DevOpsAgentAgentSpaceId
      Code:
        ZipFile: |
          # Report Generator Lambda Function
          #
          # Assembles HTML report from analyzer results stored in Hive-style S3 partitions.
          # Reads detailed findings from S3, renders sections in fixed order, handles
          # partial results with amber indicators, failed sections with error placeholders,
          # and omits skipped analyzers entirely.
          #
          # Part of the parallel orchestration architecture for Amazon Connect Operational Review.
          #
          # This is a self-contained single-file module (all renderers, recommendations,
          # and orchestration in one file) required by CFT Code.ZipFile inline deployment.

          import boto3
          import json
          import logging
          import os
          import re
          import time
          from collections import defaultdict
          from datetime import datetime, timezone
          from html import escape

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          # ════════════════════════════════════════════════════════════════════════════════
          # RECOMMENDATIONS
          # ════════════════════════════════════════════════════════════════════════════════


