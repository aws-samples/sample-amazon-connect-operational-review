  # ---------------------------------------------------------------------------
  # Lambda Function — PrepareContext
  # ---------------------------------------------------------------------------
  PrepareContextFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Reads SSM config, normalizes input into ExecutionContext
      FunctionName: ConnectOpsReview-PrepareContext
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          CONFIG_SSM_PARAM: /connect-ops-review/config
          CONNECT_INSTANCE_ARN: !Ref AmazonConnectInstanceARN
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
      Code:
        ZipFile: |
          # prepare_context.py — PrepareContext Lambda for parallel orchestration
          """
          PrepareContext Lambda handler that reads runtime configuration from SSM
          Parameter Store, applies safe defaults, and normalizes the input event
          into the ExecutionContext schema for downstream analyzer invocations.

          This is a Lambda (not a Pass state) because it must perform an SSM API
          call at runtime to read customer-configurable operational settings.
          """

          import json
          import logging
          import os
          import re
          import time

          import boto3

          logger = logging.getLogger(__name__)
          logger.setLevel(logging.INFO)

          SSM_PARAM_NAME = os.environ.get("CONFIG_SSM_PARAM", "/connect-ops-review/config")

          # Phone number prefetch safety caps (QB-25)
          MAX_PREFETCH_PHONE_NUMBERS = 200
          MAX_PREFETCH_PHONE_SECONDS = 60

          # IaC-deployed defaults (used when SSM param is missing or fields are omitted)
          DEFAULT_CONFIG = {
              "instanceArn": os.environ.get("CONNECT_INSTANCE_ARN", ""),
              "s3ReportingBucket": os.environ.get("S3_REPORTING_BUCKET", ""),
              "daysBack": 14,
              "generateHtmlReport": True,
              "retainJsonData": False,
              "enableGlueCatalog": False,
              "analyzers": {
                  "security": True,
                  "resilience": True,
                  "cloudtrail": True,
                  "operational_excellence": True,
                  "capacity": True,
                  "observability": True,
                  "cost": True,
                  "ai": True,
              },
              "analyzerTimeouts": {
                  "security": 240,
                  "resilience": 240,
                  "cloudtrail": 840,
                  "operational_excellence": 240,
                  "capacity": 540,
                  "observability": 540,
                  "cost": 240,
                  "ai": 540,
              },
          }

          # Hard ceiling for all analyzer timeouts: Lambda timeout (900s) - safety margin (60s) = 840s.
          # Any customer-configured analyzerTimeouts value exceeding this is capped.
          HARD_CEILING = 840

          # Set of recognized analyzer names for validation.
          # Entries not in this set are discarded by _cap_analyzer_timeouts().
          KNOWN_ANALYZERS = {
              "security",
              "resilience",
              "cloudtrail",
              "operational_excellence",
              "capacity",
              "observability",
              "cost",
              "ai",
          }

          # Regex for parsing Connect instance ARN components
          _ARN_PATTERN = re.compile(
              r"^arn:aws:connect:(?P<region>[^:]+):(?P<account>\d{12}):instance/(?P<instance_id>.+)$"
          )


          def lambda_handler(event, context):
              """PrepareContext Lambda handler.

              Reads runtime configuration from SSM Parameter Store, merges with
              IaC-deployed defaults, and normalizes the input event into the full
              ExecutionContext schema.

              Args:
                  event: Input event from Step Functions. Contains:
                      - rawInput (dict): The original execution input (may be {} for
                        default behavior). Supports optional overrides:
                        instanceArn, instanceId, accountId, awsRegion, daysBack,
                        s3ReportingBucket.
                      - executionStartTime, executionName (from Step Functions context)
                  context: Lambda context object.

              Returns:
                  ExecutionContext dict with all fields resolved and validated.
              """
              logger.info("PrepareContext invoked")

              # Read runtime config from SSM (falls back to defaults on any failure)
              config = _read_runtime_config()

              # Unwrap rawInput if present (Step Functions wraps execution input under rawInput key)
              raw_input = event.get("rawInput", {}) or {}

              # Build reviewId from execution metadata
              execution_start_time = event.get("executionStartTime", "")
              execution_name = event.get("executionName", "")
              review_id = f"{execution_start_time}-{execution_name}"

              # Resolve instanceArn with priority: rawInput > SSM > defaults
              instance_arn = (
                  raw_input.get("instanceArn")
                  or config.get("instanceArn")
                  or DEFAULT_CONFIG["instanceArn"]
              )

              # Resolve s3ReportingBucket with priority: rawInput > SSM > defaults
              s3_bucket = (
                  raw_input.get("s3ReportingBucket")
                  or config.get("s3ReportingBucket")
                  or DEFAULT_CONFIG["s3ReportingBucket"]
              )

              # Resolve daysBack with priority: rawInput > SSM > defaults
              days_back = (
                  raw_input.get("daysBack")
                  or config.get("daysBack")
                  or DEFAULT_CONFIG["daysBack"]
              )

              # Build enabledAnalyzers map from config
              enabled_analyzers = config.get("analyzers", DEFAULT_CONFIG["analyzers"])

              # Resolve generateHtmlReport with priority: rawInput > SSM config > default (true)
              generate_html_report = raw_input.get(
                  "generateHtmlReport",
                  config.get("generateHtmlReport", DEFAULT_CONFIG["generateHtmlReport"]),
              )

              # Resolve retainJsonData with priority: rawInput > SSM config > default (false)
              retain_json_data = raw_input.get(
                  "retainJsonData", config.get("retainJsonData", DEFAULT_CONFIG["retainJsonData"])
              )

              # Resolve enableGlueCatalog with priority: rawInput > SSM config > default (false)
              enable_glue_catalog = raw_input.get(
                  "enableGlueCatalog",
                  config.get("enableGlueCatalog", DEFAULT_CONFIG["enableGlueCatalog"]),
              )

              # Runtime enforcement of D1 / D2 (see docs/parameter-dependencies.md).
              # D1: enableGlueCatalog=true requires retainJsonData=true — otherwise DeleteJsonData
              #     empties the S3 prefixes that back Glue tables on every run.
              # D2: generateHtmlReport=false requires retainJsonData=true — otherwise the run
              #     produces no output at all.
              # Coercion is idempotent and additive: both conditions can fire on the same
              # invocation; the final value is retainJsonData=True.
              if enable_glue_catalog and not retain_json_data:
                  logger.info(
                      "Forcing retainJsonData=true because enableGlueCatalog=true (D1). "
                      "Original request would have deleted Glue-backing data."
                  )
                  retain_json_data = True
              if not generate_html_report and not retain_json_data:
                  logger.info(
                      "Forcing retainJsonData=true because generateHtmlReport=false (D2). "
                      "Original request would have produced no output."
                  )
                  retain_json_data = True

              # Cap analyzerTimeouts at hard ceilings
              raw_timeouts = config.get("analyzerTimeouts", DEFAULT_CONFIG["analyzerTimeouts"])
              analyzer_timeouts = _cap_analyzer_timeouts(raw_timeouts)

              # Parse instance components from ARN
              instance_id = raw_input.get("instanceId") or _parse_instance_id(instance_arn)
              account_id = raw_input.get("accountId") or _parse_account_id(instance_arn)
              aws_region = raw_input.get("awsRegion") or _parse_region(instance_arn)

              execution_context = {
                  "reviewId": review_id,
                  "instanceArn": instance_arn,
                  "instanceId": instance_id,
                  "accountId": account_id,
                  "awsRegion": aws_region,
                  "daysBack": days_back,
                  "s3ReportingBucket": s3_bucket,
                  "generateHtmlReport": generate_html_report,
                  "retainJsonData": retain_json_data,
                  "enabledAnalyzers": enabled_analyzers,
                  "analyzerTimeouts": analyzer_timeouts,
              }

              # Pre-fetch shared data for downstream analyzers
              shared_data = _prefetch_shared_data(
                  instance_id=instance_id,
                  instance_arn=instance_arn,
                  aws_region=aws_region,
                  s3_bucket=s3_bucket,
                  review_id=review_id,
              )
              if shared_data:
                  execution_context["sharedData"] = shared_data

              logger.info(
                  "ExecutionContext built: reviewId=%s, instanceId=%s, region=%s, "
                  "enabledAnalyzers=%s, generateHtmlReport=%s, retainJsonData=%s",
                  review_id,
                  instance_id,
                  aws_region,
                  enabled_analyzers,
                  generate_html_report,
                  retain_json_data,
              )

              return execution_context


          def _prefetch_shared_data(instance_id, instance_arn, aws_region, s3_bucket, review_id):
              """Pre-fetch shared data used by multiple analyzers and persist to S3.

              Fetches instance data, phone numbers, storage configs, and integration
              associations once and writes them to S3 under data/shared/{reviewId}/.
              Analyzers can then read from S3 instead of making duplicate API calls.

              Phone number prefetch is capped at MAX_PREFETCH_PHONE_NUMBERS and
              MAX_PREFETCH_PHONE_SECONDS to prevent runaway API calls on large
              instances (QB-25).

              Args:
                  instance_id: Connect instance ID.
                  instance_arn: Connect instance ARN.
                  aws_region: AWS region.
                  s3_bucket: S3 bucket for reports.
                  review_id: Unique review execution ID.

              Returns:
                  dict: S3 keys for each shared data file, or empty dict on total failure.
              """
              if not s3_bucket:
                  logger.warning("No s3ReportingBucket — skipping shared data pre-fetch")
                  return {}

              shared_data = {}
              s3_client = boto3.client("s3")
              connect_client = boto3.client("connect", region_name=aws_region)
              prefix = f"data/shared/{review_id}"

              # 1. DescribeInstance
              step_start = time.time()
              try:
                  response = connect_client.describe_instance(InstanceId=instance_id)
                  instance_data = response.get("Instance", {})
                  key = f"{prefix}/instance_data.json"
                  s3_client.put_object(
                      Bucket=s3_bucket,
                      Key=key,
                      Body=json.dumps(instance_data, default=str),
                      ContentType="application/json",
                  )
                  shared_data["instanceData"] = key
                  logger.info(
                      "Pre-fetched instance_data in %.1fs",
                      time.time() - step_start,
                  )
              except Exception as e:
                  logger.warning("Failed to pre-fetch instance_data: %s", str(e))

              # 2. ListPhoneNumbersV2 + DescribePhoneNumber for each
              step_start = time.time()
              try:
                  phone_numbers = []
                  capped = False
                  paginator = connect_client.get_paginator("list_phone_numbers_v2")
                  for page in paginator.paginate(InstanceId=instance_id):
                      for summary in page.get("ListPhoneNumbersSummaryList", []):
                          # QB-25: enforce count and time caps
                          if len(phone_numbers) >= MAX_PREFETCH_PHONE_NUMBERS:
                              capped = True
                              break
                          if time.time() - step_start > MAX_PREFETCH_PHONE_SECONDS:
                              capped = True
                              break

                          phone_number_id = summary.get("PhoneNumberId", "")
                          # Describe each phone number for TargetArn and status
                          if phone_number_id:
                              try:
                                  detail = connect_client.describe_phone_number(
                                      PhoneNumberId=phone_number_id
                                  )
                                  claimed = detail.get("ClaimedPhoneNumberSummary", {})
                                  summary["TargetArn"] = claimed.get("TargetArn", "")
                                  summary["PhoneNumberStatus"] = claimed.get(
                                      "PhoneNumberStatus", {}
                                  )
                              except Exception as desc_err:
                                  logger.debug(
                                      "DescribePhoneNumber failed for %s: %s",
                                      phone_number_id,
                                      str(desc_err),
                                  )
                          phone_numbers.append(summary)
                      if capped:
                          break

                  if capped:
                      logger.warning(
                          "Phone number prefetch capped at %d numbers / %.0fs "
                          "(MAX_PREFETCH_PHONE_NUMBERS=%d, MAX_PREFETCH_PHONE_SECONDS=%d)",
                          len(phone_numbers),
                          time.time() - step_start,
                          MAX_PREFETCH_PHONE_NUMBERS,
                          MAX_PREFETCH_PHONE_SECONDS,
                      )

                  key = f"{prefix}/phone_numbers.json"
                  s3_client.put_object(
                      Bucket=s3_bucket,
                      Key=key,
                      Body=json.dumps(phone_numbers, default=str),
                      ContentType="application/json",
                  )
                  shared_data["phoneNumbers"] = key
                  logger.info(
                      "Pre-fetched phone_numbers (%d numbers) in %.1fs",
                      len(phone_numbers),
                      time.time() - step_start,
                  )
              except Exception as e:
                  logger.warning("Failed to pre-fetch phone_numbers: %s", str(e))

              # 3. ListInstanceStorageConfigs (all resource types)
              step_start = time.time()
              try:
                  resource_types = [
                      "CHAT_TRANSCRIPTS",
                      "CALL_RECORDINGS",
                      "SCHEDULED_REPORTS",
                      "MEDIA_STREAMS",
                      "CONTACT_TRACE_RECORDS",
                      "AGENT_EVENTS",
                      "REAL_TIME_CONTACT_ANALYSIS_SEGMENTS",
                      "ATTACHMENTS",
                      "CONTACT_EVALUATIONS",
                      "SCREEN_RECORDINGS",
                      "REAL_TIME_CONTACT_ANALYSIS_CHAT_SEGMENTS",
                      "REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS",
                      "EMAIL_MESSAGES",
                  ]
                  all_storage_configs = {}
                  for rtype in resource_types:
                      configs = []
                      kwargs = {"InstanceId": instance_id, "ResourceType": rtype}
                      while True:
                          resp = connect_client.list_instance_storage_configs(**kwargs)
                          configs.extend(resp.get("StorageConfigs", []))
                          token = resp.get("NextToken")
                          if not token:
                              break
                          kwargs["NextToken"] = token
                      all_storage_configs[rtype] = configs

                  key = f"{prefix}/storage_configs.json"
                  s3_client.put_object(
                      Bucket=s3_bucket,
                      Key=key,
                      Body=json.dumps(all_storage_configs, default=str),
                      ContentType="application/json",
                  )
                  shared_data["storageConfigs"] = key
                  logger.info(
                      "Pre-fetched storage_configs (%d resource types) in %.1fs",
                      len(resource_types),
                      time.time() - step_start,
                  )
              except Exception as e:
                  logger.warning("Failed to pre-fetch storage_configs: %s", str(e))

              # 4. ListIntegrationAssociations (all integration types)
              step_start = time.time()
              try:
                  integration_types = [
                      "EVENT",
                      "VOICE_ID",
                      "PINPOINT_APP",
                      "WISDOM_ASSISTANT",
                      "WISDOM_KNOWLEDGE_BASE",
                      "WISDOM_QUICK_RESPONSES",
                      "CASES_DOMAIN",
                      "APPLICATION",
                  ]
                  all_integrations = {}
                  for itype in integration_types:
                      try:
                          associations = []
                          kwargs = {
                              "InstanceId": instance_id,
                              "IntegrationType": itype,
                          }
                          while True:
                              resp = connect_client.list_integration_associations(**kwargs)
                              associations.extend(
                                  resp.get("IntegrationAssociationSummaryList", [])
                              )
                              token = resp.get("NextToken")
                              if not token:
                                  break
                              kwargs["NextToken"] = token
                          all_integrations[itype] = associations
                      except Exception as itype_err:
                          logger.debug(
                              "ListIntegrationAssociations failed for %s: %s",
                              itype,
                              str(itype_err),
                          )
                          all_integrations[itype] = []

                  key = f"{prefix}/integration_associations.json"
                  s3_client.put_object(
                      Bucket=s3_bucket,
                      Key=key,
                      Body=json.dumps(all_integrations, default=str),
                      ContentType="application/json",
                  )
                  shared_data["integrationAssociations"] = key
                  logger.info(
                      "Pre-fetched integration_associations (%d types) in %.1fs",
                      len(integration_types),
                      time.time() - step_start,
                  )
              except Exception as e:
                  logger.warning("Failed to pre-fetch integration_associations: %s", str(e))

              return shared_data


          def _read_runtime_config() -> dict:
              """Read operational config from SSM Parameter Store.

              Falls back to DEFAULT_CONFIG on any failure (missing parameter,
              invalid JSON, permission error, network issue).

              Returns:
                  Parsed configuration dict, or DEFAULT_CONFIG on failure.
              """
              try:
                  ssm = boto3.client("ssm")
                  response = ssm.get_parameter(Name=SSM_PARAM_NAME)
                  value = response["Parameter"]["Value"]
                  parsed = json.loads(value)
                  if not isinstance(parsed, dict):
                      logger.warning(
                          "SSM parameter %s is not a JSON object, using defaults",
                          SSM_PARAM_NAME,
                      )
                      return DEFAULT_CONFIG
                  logger.info("Successfully read runtime config from SSM: %s", SSM_PARAM_NAME)
                  return parsed
              except Exception as e:
                  logger.warning(
                      "Failed to read SSM parameter %s: %s — using defaults",
                      SSM_PARAM_NAME,
                      str(e),
                  )
                  return DEFAULT_CONFIG


          def _cap_analyzer_timeouts(raw_timeouts: dict) -> dict:
              """Cap analyzer timeout values at the uniform HARD_CEILING.

              Iterates over the input dict, discards entries whose key is not in
              KNOWN_ANALYZERS (with a warning), and caps any value exceeding
              HARD_CEILING to 840 seconds.

              Args:
                  raw_timeouts: Dict of analyzer name to timeout seconds.

              Returns:
                  Dict with recognized analyzers only, all values ≤ HARD_CEILING.
              """
              capped_timeouts = {}
              for name, budget in raw_timeouts.items():
                  if name not in KNOWN_ANALYZERS:
                      logger.warning(
                          "analyzerTimeouts contains unrecognized analyzer '%s', discarding",
                          name,
                      )
                      continue
                  if budget > HARD_CEILING:
                      logger.warning(
                          "analyzerTimeouts.%s=%d exceeds ceiling %d, capping",
                          name,
                          budget,
                          HARD_CEILING,
                      )
                      capped_timeouts[name] = HARD_CEILING
                  else:
                      capped_timeouts[name] = budget
              return capped_timeouts


          def _parse_instance_id(instance_arn: str) -> str:
              """Extract the instance ID from a Connect instance ARN.

              Args:
                  instance_arn: Full ARN like
                      arn:aws:connect:us-east-1:123456789012:instance/abc-123

              Returns:
                  The instance ID portion, or empty string if ARN is invalid.
              """
              match = _ARN_PATTERN.match(instance_arn)
              if match:
                  return match.group("instance_id")
              logger.warning("Could not parse instanceId from ARN: %s", instance_arn)
              return ""


          def _parse_account_id(instance_arn: str) -> str:
              """Extract the AWS account ID from a Connect instance ARN.

              Args:
                  instance_arn: Full ARN like
                      arn:aws:connect:us-east-1:123456789012:instance/abc-123

              Returns:
                  The 12-digit account ID, or empty string if ARN is invalid.
              """
              match = _ARN_PATTERN.match(instance_arn)
              if match:
                  return match.group("account")
              logger.warning("Could not parse accountId from ARN: %s", instance_arn)
              return ""


          def _parse_region(instance_arn: str) -> str:
              """Extract the AWS region from a Connect instance ARN.

              Args:
                  instance_arn: Full ARN like
                      arn:aws:connect:us-east-1:123456789012:instance/abc-123

              Returns:
                  The region string, or empty string if ARN is invalid.
              """
              match = _ARN_PATTERN.match(instance_arn)
              if match:
                  return match.group("region")
              logger.warning("Could not parse awsRegion from ARN: %s", instance_arn)
              return ""

  # ---------------------------------------------------------------------------
  # Lambda Function — Security Analyzer
  # ---------------------------------------------------------------------------
  # All analyzer Lambdas use Timeout: 900. The application-level HARD_CEILING
  # is derived as: Timeout (900) − SAFETY_MARGIN (60) = 840 seconds.
  # This guarantees a 60-second persistence window between when the analyzer
  # is told to stop and when the Lambda runtime terminates the process.
  # ---------------------------------------------------------------------------
  SecurityAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Security posture — encryption, access controls, logging, compliance
      FunctionName: ConnectOpsReview-SecurityAnalyzer
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
          COMPONENT_TYPE: security
      Code:
        ZipFile: |
          # Security Analyzer Lambda Function
          #
          # Standalone Lambda that performs security analysis for Amazon Connect instances,
          # checking identity management, S3 encryption, streaming encryption, and AI guardrails.
          # Extracted from the monolithic lambda_function.py as part of the
          # split-architecture prototype.
          #
          # Uses shared utilities from analyzer_common and graceful_timeout modules
          # for standardized input validation, result formatting, S3 persistence,
          # and time budget management.

          import boto3
          import logging
          import time
          from botocore.exceptions import ClientError

          from analyzer_common import (
              validate_input,
              success_result,
              error_result,
              persist_to_s3,
              read_shared_data,
              fetch_storage_configs,
              STORAGE_RESOURCE_TYPES,
          )
          from graceful_timeout import compute_time_budget, check_time_budget, TimeBudgetExceeded

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Default time budget if maxSeconds not provided in event payload
          DEFAULT_MAX_SECONDS = 240


          def check_identity_management(
              connect_client, instance_id, start_time, time_budget, event=None
          ):
              """Check the identity management type for the Connect instance.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  event (dict, optional): Full event payload for shared data lookup.

              Returns:
                  dict: Identity management findings.
              """
              check_time_budget(start_time, time_budget)

              try:
                  # Try shared data first
                  shared_instance = read_shared_data(event, "instanceData") if event else None
                  if shared_instance:
                      instance_data = shared_instance
                      logger.info("Using pre-fetched instance data for identity management check")
                  else:
                      response = connect_client.describe_instance(InstanceId=instance_id)
                      instance_data = response.get("Instance", {})
                  identity_type = instance_data.get("IdentityManagementType", "N/A")

                  is_saml = identity_type == "SAML"
                  status = "pass" if is_saml else "fail"
                  detail = (
                      "SAML 2.0 federation configured"
                      if is_saml
                      else f"Using {identity_type} - SAML 2.0 recommended"
                  )

                  return {
                      "identity_type": identity_type,
                      "status": status,
                      "detail": detail,
                      "recommendation": None
                      if is_saml
                      else (
                          "AWS recommends SAML 2.0 federation with an external identity provider "
                          "(IdP) such as Okta, Azure AD, or AWS IAM Identity Center for production "
                          "Amazon Connect instances."
                      ),
                  }
              except ClientError as e:
                  logger.error(f"Error checking identity management: {e}")
                  return {
                      "identity_type": "unknown",
                      "status": "error",
                      "detail": str(e)[:1024],
                      "recommendation": None,
                  }


          def check_s3_encryption(connect_client, instance_id, start_time, time_budget):
              """Check S3 encryption configuration for all storage types.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: S3 encryption findings with per-resource details.
              """
              s3_encryption_details = []
              unencrypted_buckets = []
              total_configs = 0

              # Fetch all storage configs via shared utility (QB-5)
              all_storage_configs = fetch_storage_configs(
                  connect_client, instance_id, start_time, time_budget
              )

              for rtype, cfg in all_storage_configs:
                  stype = cfg.get("StorageType", "N/A")
                  if stype == "S3" and "S3Config" in cfg:
                      total_configs += 1
                      s3c = cfg["S3Config"]
                      bucket_name = s3c.get("BucketName", "N/A")
                      enc = s3c.get("EncryptionConfig")

                      if enc:
                          key_id = enc.get("KeyId", "")
                          if key_id and not key_id.startswith("alias/aws/"):
                              s3_encryption_details.append(
                                  {
                                      "resource_type": rtype.replace("_", " ").title(),
                                      "bucket": bucket_name,
                                      "status": "CMK",
                                      "key": key_id[-12:],
                                  }
                              )
                          else:
                              s3_encryption_details.append(
                                  {
                                      "resource_type": rtype.replace("_", " ").title(),
                                      "bucket": bucket_name,
                                      "status": "AWS Managed",
                                      "key": key_id[-12:] if key_id else "",
                                  }
                              )
                      else:
                          unencrypted_buckets.append(
                              {
                                  "resource_type": rtype.replace("_", " ").title(),
                                  "bucket": bucket_name,
                              }
                          )
                          s3_encryption_details.append(
                              {
                                  "resource_type": rtype.replace("_", " ").title(),
                                  "bucket": bucket_name,
                                  "status": "None",
                                  "key": "",
                              }
                          )

              cmk_count = sum(1 for d in s3_encryption_details if d["status"] == "CMK")
              aws_managed_count = sum(
                  1 for d in s3_encryption_details if d["status"] == "AWS Managed"
              )
              none_count = len(unencrypted_buckets)

              if total_configs == 0:
                  status = "info"
                  detail = "No S3 storage configs found"
              elif none_count > 0:
                  status = "fail"
                  detail = f"{cmk_count} CMK, {aws_managed_count} AWS Managed, {none_count} missing encryption"
              else:
                  status = "pass"
                  detail = f"All {total_configs} S3 configs encrypted ({cmk_count} CMK, {aws_managed_count} AWS Managed)"

              return {
                  "total_configs": total_configs,
                  "cmk_count": cmk_count,
                  "aws_managed_count": aws_managed_count,
                  "unencrypted_count": none_count,
                  "status": status,
                  "detail": detail,
                  "encryption_details": s3_encryption_details,
                  "unencrypted_buckets": unencrypted_buckets,
              }


          def check_streaming_encryption(connect_client, instance_id, start_time, time_budget):
              """Check encryption configuration for data streaming (KVS, KDS, Firehose).

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  dict: Streaming encryption findings.
              """
              streaming_encryption_info = []

              # Fetch all storage configs via shared utility (QB-5)
              all_storage_configs = fetch_storage_configs(
                  connect_client, instance_id, start_time, time_budget
              )

              for rtype, cfg in all_storage_configs:
                  stype = cfg.get("StorageType", "N/A")

                  if stype == "KINESIS_VIDEO_STREAM" and "KinesisVideoStreamConfig" in cfg:
                      kvc = cfg["KinesisVideoStreamConfig"]
                      kvs_retention = kvc.get("RetentionPeriodHours", 0)
                      enc = kvc.get("EncryptionConfig")
                      has_enc = bool(enc)
                      streaming_encryption_info.append(
                          {
                              "resource_type": rtype.replace("_", " ").title(),
                              "stream_type": "Kinesis Video Stream",
                              "destination": f"KVS prefix: {kvc.get('Prefix', '')} (retention: {kvs_retention}h)",
                              "encrypted": has_enc,
                              "retention_hours": kvs_retention,
                          }
                      )
                  elif stype == "KINESIS_STREAM" and "KinesisStreamConfig" in cfg:
                      destination = cfg["KinesisStreamConfig"].get("StreamArn", "")
                      streaming_encryption_info.append(
                          {
                              "resource_type": rtype.replace("_", " ").title(),
                              "stream_type": "Kinesis Data Stream",
                              "destination": destination.split("/")[-1]
                              if "/" in destination
                              else destination,
                              "encrypted": None,  # Encryption managed at stream level
                          }
                      )
                  elif stype == "KINESIS_FIREHOSE" and "KinesisFirehoseConfig" in cfg:
                      destination = cfg["KinesisFirehoseConfig"].get("FirehoseArn", "")
                      streaming_encryption_info.append(
                          {
                              "resource_type": rtype.replace("_", " ").title(),
                              "stream_type": "Kinesis Firehose",
                              "destination": destination.split("/")[-1]
                              if "/" in destination
                              else destination,
                              "encrypted": None,  # Encryption managed at delivery stream level
                          }
                      )

              if not streaming_encryption_info:
                  return {
                      "total_streams": 0,
                      "status": "info",
                      "detail": "No streaming configurations found",
                      "streams": [],
                  }

              total_streams = len(streaming_encryption_info)
              kvs_streams = [
                  s
                  for s in streaming_encryption_info
                  if s["stream_type"] == "Kinesis Video Stream"
              ]
              kvs_encrypted = sum(1 for s in kvs_streams if s["encrypted"] is True)
              kvs_unencrypted = sum(1 for s in kvs_streams if s["encrypted"] is False)
              kds_streams = [
                  s
                  for s in streaming_encryption_info
                  if s["stream_type"] == "Kinesis Data Stream"
              ]
              firehose_streams = [
                  s for s in streaming_encryption_info if s["stream_type"] == "Kinesis Firehose"
              ]

              summary_parts = []
              if kvs_streams:
                  summary_parts.append(f"{kvs_encrypted}/{len(kvs_streams)} KVS encrypted")
              if kds_streams:
                  summary_parts.append(f"{len(kds_streams)} KDS (verify at stream level)")
              if firehose_streams:
                  summary_parts.append(
                      f"{len(firehose_streams)} Firehose (verify at stream level)"
                  )

              if kvs_unencrypted > 0:
                  status = "fail"
                  detail = f"{kvs_unencrypted} KVS stream(s) missing encryption; {', '.join(summary_parts)}"
              elif kds_streams or firehose_streams:
                  status = "warn"
                  detail = f"{total_streams} stream(s) configured; {', '.join(summary_parts)}"
              else:
                  status = "pass"
                  detail = f"All {total_streams} stream(s) encrypted"

              return {
                  "total_streams": total_streams,
                  "kvs_encrypted": kvs_encrypted,
                  "kvs_unencrypted": kvs_unencrypted,
                  "kds_count": len(kds_streams),
                  "firehose_count": len(firehose_streams),
                  "status": status,
                  "detail": detail,
                  "streams": streaming_encryption_info,
              }


          def _build_storage_configs(connect_client, instance_id, start_time, time_budget):
              """Build a unified storage configs list covering ALL resource types.

              This produces the data needed for the Data Storage Configuration table,
              including "Not configured" entries for resource types with no storage.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.

              Returns:
                  list: List of dicts with resource_type, storage_type, destination,
                        encryption for each configured (and unconfigured) resource type.
              """
              storage_configs = []

              # Fetch all storage configs via shared utility (QB-5)
              all_storage_configs = fetch_storage_configs(
                  connect_client, instance_id, start_time, time_budget
              )

              # Build a set of resource types that have configs
              configured_rtypes = set()
              for rtype, cfg in all_storage_configs:
                  configured_rtypes.add(rtype)

              for rtype in STORAGE_RESOURCE_TYPES:
                  rtype_configs = [(rt, c) for rt, c in all_storage_configs if rt == rtype]

                  if not rtype_configs:
                      # No storage configured for this resource type
                      storage_configs.append(
                          {
                              "resource_type": rtype.replace("_", " ").title(),
                              "storage_type": "Not configured",
                              "destination": "-",
                              "encryption": "-",
                          }
                      )
                  else:
                      for _rt, cfg in rtype_configs:
                          stype = cfg.get("StorageType", "N/A")
                          destination = "-"
                          encryption = "None"

                          if stype == "S3" and "S3Config" in cfg:
                              s3c = cfg["S3Config"]
                              bucket = s3c.get("BucketName", "")
                              prefix = s3c.get("BucketPrefix", "")
                              destination = (
                                  f"s3://{bucket}/{prefix}" if prefix else f"s3://{bucket}"
                              )
                              enc = s3c.get("EncryptionConfig")
                              if enc:
                                  key_id = enc.get("KeyId", "")
                                  if key_id and not key_id.startswith("alias/aws/"):
                                      encryption = f"KMS: ...{key_id[-12:]}"
                                  else:
                                      encryption = "AWS Managed"
                          elif (
                              stype == "KINESIS_VIDEO_STREAM"
                              and "KinesisVideoStreamConfig" in cfg
                          ):
                              kvs = cfg["KinesisVideoStreamConfig"]
                              prefix = kvs.get("Prefix", "")
                              retention = kvs.get("RetentionPeriodHours", 0)
                              destination = f"KVS prefix: {prefix}" if prefix else "KVS"
                              enc = kvs.get("EncryptionConfig")
                              if enc:
                                  key_id = enc.get("KeyId", "")
                                  if key_id and not key_id.startswith("alias/aws/"):
                                      encryption = f"KMS: ...{key_id[-12:]}"
                                  else:
                                      encryption = "AWS Managed"
                          elif stype == "KINESIS_STREAM" and "KinesisStreamConfig" in cfg:
                              kds = cfg["KinesisStreamConfig"]
                              stream_arn = kds.get("StreamArn", "")
                              destination = (
                                  stream_arn.split("/")[-1] if "/" in stream_arn else stream_arn
                              )
                          elif stype == "KINESIS_FIREHOSE" and "KinesisFirehoseConfig" in cfg:
                              fh = cfg["KinesisFirehoseConfig"]
                              firehose_arn = fh.get("FirehoseArn", "")
                              destination = (
                                  firehose_arn.split("/")[-1]
                                  if "/" in firehose_arn
                                  else firehose_arn
                              )

                          storage_configs.append(
                              {
                                  "resource_type": rtype.replace("_", " ").title(),
                                  "storage_type": stype.replace("_", " ").title()
                                  if stype != "N/A"
                                  else stype,
                                  "destination": destination,
                                  "encryption": encryption,
                              }
                          )

              return storage_configs


          def lambda_handler(event, context):
              """Security Analyzer Lambda handler.

              Validates input using shared validate_input, checks identity management,
              S3 encryption, streaming encryption, and AI guardrails with graceful timeout,
              persists results to S3 Hive-style path, and returns a standardized
              AnalyzerResult.

              Args:
                  event (dict): Input event with reviewId, instanceId, instanceArn,
                                accountId, awsRegion, daysBack, componentType,
                                s3ReportingBucket, and optional maxSeconds.
                  context: Lambda context object.

              Returns:
                  dict: Standardized AnalyzerResult (success or error).
              """
              logger.info("Security Analyzer invoked")
              execution_start = time.time()

              # Validate required input fields using shared utility
              try:
                  validate_input(event)
              except ValueError as e:
                  logger.error(str(e))
                  return error_result(
                      event.get("componentType", "security"),
                      str(e),
                  )

              instance_id = event["instanceId"]
              account_id = event["accountId"]
              aws_region = event["awsRegion"]
              component_type = event["componentType"]

              # Accept maxSeconds from event payload (passed via analyzerTimeouts from PrepareContext)
              max_seconds = event.get("maxSeconds", DEFAULT_MAX_SECONDS)

              # Compute internal time budget using shared graceful timeout utility
              time_budget = compute_time_budget(max_seconds)

              logger.info(
                  f"Analyzing security for instance={instance_id}, "
                  f"account={account_id}, region={aws_region}, "
                  f"max_seconds={max_seconds}, time_budget={time_budget}"
              )

              connect_client = boto3.client("connect", region_name=aws_region)
              timed_out = False
              checks_completed = []

              try:
                  # Check 1: Identity Management
                  identity_findings = check_identity_management(
                      connect_client, instance_id, execution_start, time_budget, event=event
                  )
                  checks_completed.append("identity_management")

                  # Check 2: S3 Encryption
                  s3_findings = check_s3_encryption(
                      connect_client, instance_id, execution_start, time_budget
                  )
                  checks_completed.append("s3_encryption")

                  # Check 3: Streaming Encryption
                  streaming_findings = check_streaming_encryption(
                      connect_client, instance_id, execution_start, time_budget
                  )
                  checks_completed.append("streaming_encryption")

                  # Check 4: Unified Storage Configuration (all resource types)
                  storage_configs = _build_storage_configs(
                      connect_client, instance_id, execution_start, time_budget
                  )
                  checks_completed.append("storage_configs")

                  findings = {
                      "identity_management": identity_findings,
                      "s3_encryption": s3_findings,
                      "streaming_encryption": streaming_findings,
                      "storage_configs": storage_configs,
                      "checks_completed": checks_completed,
                      "timed_out": False,
                      "account_id": account_id,
                      "region": aws_region,
                  }

                  # Persist results to S3 Hive-style path before returning
                  s3_key = persist_to_s3(event, findings)

                  duration_ms = int((time.time() - execution_start) * 1000)

                  logger.info(
                      f"Security analysis complete: {len(checks_completed)} checks completed"
                  )

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                  )

              except TimeBudgetExceeded:
                  timed_out = True
                  logger.info(
                      f"Security Analyzer reached time budget after completing "
                      f"{len(checks_completed)} of 4 checks: {checks_completed}"
                  )

                  # Build partial findings from whatever checks completed
                  findings = {
                      "checks_completed": checks_completed,
                      "timed_out": True,
                      "account_id": account_id,
                      "region": aws_region,
                  }
                  if "identity_management" in checks_completed:
                      findings["identity_management"] = identity_findings
                  if "s3_encryption" in checks_completed:
                      findings["s3_encryption"] = s3_findings
                  if "streaming_encryption" in checks_completed:
                      findings["streaming_encryption"] = streaming_findings
                  if "storage_configs" in checks_completed:
                      findings["storage_configs"] = storage_configs

                  collected_count = len(checks_completed)
                  total_estimated = 4  # Total number of security checks

                  # Persist partial results to S3 before returning
                  s3_key = persist_to_s3(
                      event,
                      findings,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

                  duration_ms = int((time.time() - execution_start) * 1000)

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

              except ClientError as e:
                  error_msg = str(e)
                  logger.error(f"AWS API error in Security Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)
              except Exception as e:
                  error_msg = str(e)
                  logger.error(f"Unexpected error in Security Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)

  # ---------------------------------------------------------------------------
  # Lambda Function — Resilience Analyzer
  # ---------------------------------------------------------------------------
  ResilienceAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Resilience — multi-region, DR readiness, redundancy checks
      FunctionName: ConnectOpsReview-ResilienceAnalyzer
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt SharedLambdaRole.Arn
      Layers:
        - !GetAtt SharedUtilsLayerCustomResourceV2.LayerVersionArn
      LoggingConfig:
        LogGroup: !Ref SharedLambdaLogGroup
      Environment:
        Variables:
          S3_REPORTING_BUCKET: !Ref AmazonS3ForReports
          COMPONENT_TYPE: resilience
      Code:
        ZipFile: |
          # Resilience Analyzer Lambda Function
          #
          # Standalone Lambda that performs resilience analysis for Amazon Connect instances,
          # checking multi-region configuration (ACGR), DR readiness, carrier diversity,
          # and knowledge base sync health.
          # Extracted from the monolithic lambda_function.py as part of the
          # parallel orchestration architecture.
          #
          # Uses shared utilities from analyzer_common and graceful_timeout modules
          # for standardized input validation, result formatting, S3 persistence,
          # and time budget management.

          import boto3
          import logging
          import time
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from botocore.exceptions import ClientError

          from analyzer_common import (
              validate_input,
              success_result,
              error_result,
              persist_to_s3,
              discover_assistant_id,
              fetch_phone_numbers,
          )
          from graceful_timeout import compute_time_budget, check_time_budget, TimeBudgetExceeded

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Default time budget if maxSeconds not provided in event payload
          DEFAULT_MAX_SECONDS = 240


          def check_multi_region_config(
              connect_client, instance_id, start_time, time_budget, event=None
          ):
              """Check multi-region / Global Resiliency (ACGR) configuration.

              Examines the Connect instance's ReplicationConfiguration to determine
              whether a replica instance exists in another region for DR purposes.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  event (dict, optional): Full event payload for shared data lookup.

              Returns:
                  dict: Multi-region configuration findings.
              """
              check_time_budget(start_time, time_budget)

              try:
                  response = connect_client.describe_instance(InstanceId=instance_id)
                  instance_data = response.get("Instance", {})

                  # Check for replication configuration in the response
                  replication_config = response.get("ReplicationConfiguration")

                  if replication_config:
                      replication_region = replication_config.get("ReplicationRegion", "N/A")
                      replication_status = replication_config.get("ReplicationStatus", "N/A")
                      replication_message = replication_config.get("ReplicationStatusMessage", "")

                      return {
                          "has_replica": True,
                          "replication_region": replication_region,
                          "replication_status": replication_status,
                          "replication_status_message": replication_message,
                          "status": "pass",
                          "detail": f"ACGR replica configured in {replication_region} (status: {replication_status})",
                      }
                  else:
                      return {
                          "has_replica": False,
                          "replication_region": None,
                          "replication_status": None,
                          "replication_status_message": None,
                          "status": "info",
                          "detail": "No ACGR replica configured — consider enabling Global Resiliency for DR",
                          "recommendation": (
                              "Amazon Connect Global Resiliency (ACGR) provides geographic telephony "
                              "redundancy, offering a flexible solution to distribute inbound voice "
                              "traffic and agents across linked instances in another Region in the "
                              "event of unplanned Region outages or disruptions."
                          ),
                      }
              except ClientError as e:
                  logger.error(f"Error checking multi-region config: {e}")
                  return {
                      "has_replica": False,
                      "replication_region": None,
                      "replication_status": None,
                      "status": "error",
                      "detail": str(e)[:1024],
                  }


          def check_carrier_diversity(
              connect_client, instance_id, start_time, time_budget, aws_region, event=None
          ):
              """Check phone number carrier diversity for redundancy.

              Examines all phone numbers claimed by the instance and groups them by
              country code and carrier to assess whether there is sufficient carrier
              diversity for resilience.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  aws_region (str): AWS region for Pinpoint client.
                  event (dict, optional): Full event payload for shared data lookup.

              Returns:
                  dict: Carrier diversity findings.
              """
              check_time_budget(start_time, time_budget)

              phone_numbers = []
              phone_type_counts = {
                  "TOLL_FREE": 0,
                  "DID": 0,
                  "UIFN": 0,
                  "SHARED": 0,
                  "THIRD_PARTY_TF": 0,
                  "THIRD_PARTY_DID": 0,
                  "SHORT_CODE": 0,
              }
              country_counts = Counter()

              # Create Pinpoint client once for all carrier lookups (QB-3)
              pinpoint_client = boto3.client("pinpoint", region_name=aws_region)

              # Fetch phone numbers via shared utility (QB-4)
              raw_numbers = fetch_phone_numbers(
                  connect_client, instance_id, start_time, time_budget, event
              )

              for number_summary in raw_numbers:
                  phone_type = number_summary.get("PhoneNumberType", "UNKNOWN")
                  country_code = number_summary.get("PhoneNumberCountryCode", "UNKNOWN")
                  if phone_type in phone_type_counts:
                      phone_type_counts[phone_type] += 1
                  country_counts[country_code] += 1

                  carrier = _get_phone_carrier(
                      number_summary.get("PhoneNumber", ""),
                      country_code,
                      pinpoint_client,
                  )
                  # Rate-limit Pinpoint calls to ~10 TPS (QB-6)
                  time.sleep(0.1)

                  phone_numbers.append(
                      {
                          "phone_number_id": number_summary.get("PhoneNumberId", ""),
                          "phone_number": number_summary.get("PhoneNumber", ""),
                          "phone_number_type": phone_type,
                          "phone_number_country_code": country_code,
                          "phone_number_carrier": carrier,
                      }
                  )

              # Group by country code + carrier for diversity analysis
              carrier_groups = defaultdict(list)
              for pn in phone_numbers:
                  key = f"{pn['phone_number_country_code']} | {pn['phone_number_carrier']}"
                  carrier_groups[key].append(pn["phone_number"])

              num_carriers = len(carrier_groups)
              total_numbers = len(phone_numbers)

              if num_carriers > 1:
                  status = "pass"
                  detail = f"{total_numbers} numbers across {num_carriers} carrier groups"
              elif total_numbers > 0:
                  status = "warn"
                  detail = (
                      f"All {total_numbers} numbers on a single carrier — consider diversifying"
                  )
              else:
                  status = "info"
                  detail = "No phone numbers configured"

              return {
                  "total_numbers": total_numbers,
                  "carrier_groups": num_carriers,
                  "carrier_group_details": {k: len(v) for k, v in carrier_groups.items()},
                  "phone_numbers_by_group": dict(carrier_groups),
                  "phone_type_counts": {k: v for k, v in phone_type_counts.items() if v > 0},
                  "country_distribution": dict(country_counts),
                  "status": status,
                  "detail": detail,
              }


          def _get_phone_carrier(phone_number, country_code, pinpoint_client):
              """Look up the carrier for a phone number using Pinpoint.

              Args:
                  phone_number (str): E.164 phone number.
                  country_code (str): ISO country code.
                  pinpoint_client: Pre-created Boto3 Pinpoint client.

              Returns:
                  str: Carrier name or 'Unknown' on failure.
              """
              if not phone_number:
                  return "Unknown"
              try:
                  response = pinpoint_client.phone_number_validate(
                      NumberValidateRequest={
                          "PhoneNumber": phone_number,
                          "IsoCountryCode": country_code,
                      }
                  )
                  return response.get("NumberValidateResponse", {}).get("Carrier", "Unknown")
              except Exception as e:
                  logger.debug(f"Carrier lookup failed for {phone_number}: {e}")
                  return "Unknown"


          def check_dr_readiness(
              connect_client, instance_id, start_time, time_budget, aws_region, event=None
          ):
              """Check DR readiness indicators for the Connect instance.

              Evaluates overall disaster recovery posture by checking:
              - Whether the instance has inbound/outbound calls enabled
              - Multi-AZ architecture (inherent in Connect)
              - Knowledge base sync health (if Q/Wisdom is configured)

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  aws_region (str): AWS region.
                  event (dict, optional): Full event payload for shared data lookup.

              Returns:
                  tuple: (dr_readiness_findings, kb_sync_health_detail) where
                         dr_readiness_findings is the check result dict and
                         kb_sync_health_detail is per-KB detail data (or None).
              """
              check_time_budget(start_time, time_budget)

              dr_checks = []
              kb_sync_detail = None

              # Check 1: Multi-AZ is inherent — always pass
              dr_checks.append(
                  {
                      "check": "Multi-AZ Architecture",
                      "status": "pass",
                      "detail": (
                          "Amazon Connect instances are deployed across a minimum of 3 AZs "
                          "in an active-active-active configuration within each Region."
                      ),
                  }
              )

              # Check 2: Instance call configuration
              try:
                  response = connect_client.describe_instance(InstanceId=instance_id)
                  instance_data = response.get("Instance", {})
                  inbound = instance_data.get("InboundCallsEnabled", False)
                  outbound = instance_data.get("OutboundCallsEnabled", False)

                  if inbound and outbound:
                      dr_checks.append(
                          {
                              "check": "Call Configuration",
                              "status": "pass",
                              "detail": "Both inbound and outbound calls enabled",
                          }
                      )
                  else:
                      dr_checks.append(
                          {
                              "check": "Call Configuration",
                              "status": "info",
                              "detail": f"Inbound={inbound}, Outbound={outbound}",
                          }
                      )
              except ClientError as e:
                  logger.warning(f"Error checking call configuration: {e}")
                  dr_checks.append(
                      {
                          "check": "Call Configuration",
                          "status": "error",
                          "detail": str(e)[:1024],
                      }
                  )

              # Check 3: Knowledge Base Sync Health (if Q/Wisdom is configured)
              check_time_budget(start_time, time_budget)
              kb_check_result, kb_sync_detail = _check_kb_sync_health(
                  connect_client, instance_id, start_time, time_budget, aws_region
              )
              if kb_check_result:
                  dr_checks.append(kb_check_result)

              # Determine overall DR readiness status
              statuses = [c["status"] for c in dr_checks]
              if "error" in statuses:
                  overall_status = "warn"
                  overall_detail = "DR readiness check encountered errors"
              elif "warn" in statuses:
                  overall_status = "warn"
                  overall_detail = "Some DR readiness concerns identified"
              else:
                  overall_status = "pass"
                  overall_detail = f"All {len(dr_checks)} DR readiness checks passed"

              dr_findings = {
                  "checks": dr_checks,
                  "total_checks": len(dr_checks),
                  "status": overall_status,
                  "detail": overall_detail,
              }

              return dr_findings, kb_sync_detail


          def _check_kb_sync_health(
              connect_client, instance_id, start_time, time_budget, aws_region
          ):
              """Check knowledge base sync health for DR readiness.

              Args:
                  connect_client: Boto3 Connect client.
                  instance_id (str): Connect instance ID.
                  start_time (float): Epoch timestamp when execution began.
                  time_budget (int): Time budget in seconds.
                  aws_region (str): AWS region.

              Returns:
                  tuple: (check_dict, kb_sync_detail) where check_dict is the summary
                         check result for dr_readiness.checks[] and kb_sync_detail is
                         the per-KB detail data for the kb_sync_health top-level key.
                         Returns (None, None) if no assistant found.
              """
              # Discover assistant ID from Connect instance integration associations
              assistant_id = discover_assistant_id(connect_client, instance_id)
              if not assistant_id:
                  return None, None

              try:
                  qconnect_client = boto3.client("qconnect", region_name=aws_region)

                  check_time_budget(start_time, time_budget)
                  assoc_resp = qconnect_client.list_assistant_associations(
                      assistantId=assistant_id, maxResults=100
                  )
                  all_associations = assoc_resp.get("assistantAssociationSummaries", [])
                  kb_associations = [
                      a for a in all_associations if a.get("associationType") == "KNOWLEDGE_BASE"
                  ]

                  if not kb_associations:
                      check_result = {
                          "check": "Knowledge Base Sync Health",
                          "status": "info",
                          "detail": "No knowledge bases associated with assistant",
                      }
                      return check_result, {"kb_associations": [], "review_kbs": []}

                  stale_kbs = []
                  kb_details = []
                  for assoc in kb_associations:
                      check_time_budget(start_time, time_budget)
                      kb_id = (
                          assoc.get("associationData", {})
                          .get("knowledgeBaseAssociation", {})
                          .get("knowledgeBaseId", "")
                      )
                      if not kb_id:
                          continue
                      try:
                          kb_resp = qconnect_client.get_knowledge_base(knowledgeBaseId=kb_id)
                          kb = kb_resp.get("knowledgeBase", {})
                          kb_name = kb.get("name", kb_id)
                          kb_status = kb.get("status", "UNKNOWN")
                          last_modified = kb.get("lastContentModificationTime")

                          if last_modified:
                              now = datetime.now(timezone.utc)
                              hours_since = (now - last_modified).total_seconds() / 3600
                              days_since = hours_since / 24

                              # Determine freshness color
                              if hours_since <= 24:
                                  freshness = "Fresh"
                                  freshness_color = "#22c55e"
                              elif hours_since <= 168:  # 7 days
                                  freshness = "Recent"
                                  freshness_color = "#f59e0b"
                              else:
                                  freshness = "Stale"
                                  freshness_color = "#ef4444"
                                  stale_kbs.append(kb_name)

                              last_modified_str = last_modified.strftime("%Y-%m-%d %H:%M UTC")
                              time_since_update = (
                                  f"{days_since:.1f} days"
                                  if days_since >= 1
                                  else f"{hours_since:.1f} hours"
                              )
                          else:
                              freshness = "Unknown"
                              freshness_color = "#6b7280"
                              last_modified_str = "Never"
                              time_since_update = "N/A"

                          kb_details.append(
                              {
                                  "name": kb_name,
                                  "kb_id": kb_id,
                                  "status": kb_status,
                                  "last_modified_str": last_modified_str,
                                  "time_since_update": time_since_update,
                                  "freshness": freshness,
                                  "freshness_color": freshness_color,
                              }
                          )
                      except Exception as e:
                          logger.warning(f"Error checking KB {kb_id}: {e}")
                          kb_details.append(
                              {
                                  "name": kb_id,
                                  "kb_id": kb_id,
                                  "status": "ERROR",
                                  "last_modified_str": "Error",
                                  "time_since_update": "N/A",
                                  "freshness": "Unknown",
                                  "freshness_color": "#6b7280",
                              }
                          )

                  if stale_kbs:
                      check_result = {
                          "check": "Knowledge Base Sync Health",
                          "status": "warn",
                          "detail": f"{len(stale_kbs)} KB(s) not updated in 7+ days: {', '.join(stale_kbs[:3])}",
                      }
                  else:
                      check_result = {
                          "check": "Knowledge Base Sync Health",
                          "status": "pass",
                          "detail": f"{len(kb_associations)} KB(s) checked — content is fresh",
                      }

                  kb_sync_detail = {
                      "kb_associations": kb_details,
                      "review_kbs": stale_kbs,
                  }

                  return check_result, kb_sync_detail

              except Exception as e:
                  logger.warning(f"Error checking KB sync health: {e}")
                  check_result = {
                      "check": "Knowledge Base Sync Health",
                      "status": "error",
                      "detail": str(e)[:1024],
                  }
                  return check_result, None


          def lambda_handler(event, context):
              """Resilience Analyzer Lambda handler.

              Validates input using shared validate_input, checks multi-region
              configuration (ACGR), carrier diversity, and DR readiness with graceful
              timeout, persists results to S3 Hive-style path, and returns a
              standardized AnalyzerResult.

              Args:
                  event (dict): Input event with reviewId, instanceId, instanceArn,
                                accountId, awsRegion, daysBack, componentType,
                                s3ReportingBucket, and optional maxSeconds.
                  context: Lambda context object.

              Returns:
                  dict: Standardized AnalyzerResult (success or error).
              """
              logger.info("Resilience Analyzer invoked")
              execution_start = time.time()

              # Validate required input fields using shared utility
              try:
                  validate_input(event)
              except ValueError as e:
                  logger.error(str(e))
                  return error_result(
                      event.get("componentType", "resilience"),
                      str(e),
                  )

              instance_id = event["instanceId"]
              account_id = event["accountId"]
              aws_region = event["awsRegion"]
              component_type = event["componentType"]

              # Accept maxSeconds from event payload (passed via analyzerTimeouts from PrepareContext)
              max_seconds = event.get("maxSeconds", DEFAULT_MAX_SECONDS)

              # Compute internal time budget using shared graceful timeout utility
              time_budget = compute_time_budget(max_seconds)

              logger.info(
                  f"Analyzing resilience for instance={instance_id}, "
                  f"account={account_id}, region={aws_region}, "
                  f"max_seconds={max_seconds}, time_budget={time_budget}"
              )

              connect_client = boto3.client("connect", region_name=aws_region)
              checks_completed = []

              try:
                  # Check 1: Multi-Region Configuration (ACGR)
                  multi_region_findings = check_multi_region_config(
                      connect_client, instance_id, execution_start, time_budget
                  )
                  checks_completed.append("multi_region")

                  # Check 2: Carrier Diversity
                  carrier_diversity_findings = check_carrier_diversity(
                      connect_client,
                      instance_id,
                      execution_start,
                      time_budget,
                      aws_region,
                      event=event,
                  )
                  checks_completed.append("carrier_diversity")

                  # Check 3: DR Readiness
                  dr_readiness_findings, kb_sync_health_detail = check_dr_readiness(
                      connect_client,
                      instance_id,
                      execution_start,
                      time_budget,
                      aws_region,
                      event=event,
                  )
                  checks_completed.append("dr_readiness")

                  findings = {
                      "multi_region": multi_region_findings,
                      "carrier_diversity": carrier_diversity_findings,
                      "dr_readiness": dr_readiness_findings,
                      "checks_completed": checks_completed,
                      "timed_out": False,
                      "account_id": account_id,
                      "region": aws_region,
                  }

                  # Add KB sync health detail as top-level key if available
                  if kb_sync_health_detail:
                      findings["kb_sync_health"] = kb_sync_health_detail

                  # Persist results to S3 Hive-style path before returning
                  s3_key = persist_to_s3(event, findings)

                  duration_ms = int((time.time() - execution_start) * 1000)

                  logger.info(
                      f"Resilience analysis complete: {len(checks_completed)} checks completed"
                  )

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                  )

              except TimeBudgetExceeded:
                  logger.info(
                      f"Resilience Analyzer reached time budget after completing "
                      f"{len(checks_completed)} of 3 checks: {checks_completed}"
                  )

                  # Build partial findings from whatever checks completed
                  findings = {
                      "checks_completed": checks_completed,
                      "timed_out": True,
                      "account_id": account_id,
                      "region": aws_region,
                  }
                  if "multi_region" in checks_completed:
                      findings["multi_region"] = multi_region_findings
                  if "carrier_diversity" in checks_completed:
                      findings["carrier_diversity"] = carrier_diversity_findings
                  if "dr_readiness" in checks_completed:
                      findings["dr_readiness"] = dr_readiness_findings
                      if kb_sync_health_detail:
                          findings["kb_sync_health"] = kb_sync_health_detail

                  collected_count = len(checks_completed)
                  total_estimated = 3  # Total number of resilience checks

                  # Persist partial results to S3 before returning
                  s3_key = persist_to_s3(
                      event,
                      findings,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

                  duration_ms = int((time.time() - execution_start) * 1000)

                  return success_result(
                      component_type,
                      findings,
                      duration_ms=duration_ms,
                      s3_key=s3_key,
                      partial=True,
                      collected_count=collected_count,
                      total_estimated=total_estimated,
                  )

              except ClientError as e:
                  error_msg = str(e)
                  logger.error(f"AWS API error in Resilience Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)
              except Exception as e:
                  error_msg = str(e)
                  logger.error(f"Unexpected error in Resilience Analyzer: {error_msg}")
                  return error_result(component_type, error_msg)

