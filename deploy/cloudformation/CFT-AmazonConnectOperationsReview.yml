              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ReportGeneratorFunction.Arn}",
                "Payload": {
                  "reviewId.$": "$.reviewId",
                  "instanceId.$": "$.instanceId",
                  "instanceArn.$": "$.instanceArn",
                  "accountId.$": "$.accountId",
                  "awsRegion.$": "$.awsRegion",
                  "s3ReportingBucket.$": "$.s3ReportingBucket",
                  "analyzerResults.$": "$.analyzerResults"
                }
              },
              "TimeoutSeconds": 300,
              "ResultSelector": {
                "reportUrl.$": "$.Payload.reportUrl",
                "reviewId.$": "$.Payload.reviewId",
                "status.$": "$.Payload.status",
                "analyzersSucceeded.$": "$.Payload.analyzersSucceeded",
                "analyzersFailed.$": "$.Payload.analyzersFailed",
                "analyzersSkipped.$": "$.Payload.analyzersSkipped"
              },
              "ResultPath": "$.reportResult",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 3,
                  "MaxAttempts": 1
                }
              ],
              "Next": "CheckDeleteData"
            },

            "CheckDeleteData": {
              "Type": "Choice",
              "Comment": "Delete JSON data only if retainJsonData=false AND report was generated",
              "Choices": [
                {
                  "Variable": "$.retainJsonData",
                  "BooleanEquals": true,
                  "Next": "SkipDelete"
                }
              ],
              "Default": "DeleteJsonData"
            },

            "DeleteJsonData": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${DeleteJsonDataFunction.Arn}",
                "Payload": {
                  "reviewId.$": "$.reviewId",
                  "s3ReportingBucket.$": "$.s3ReportingBucket"
                }
              },
              "TimeoutSeconds": 60,
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "SkipDelete",
                  "ResultPath": "$.deleteError"
                }
              ],
              "Next": "SkipDelete"
            },

            "SkipDelete": {
              "Type": "Pass",
              "End": true
            }
          }
        }

  # ---------------------------------------------------------------------------
  # SSM Parameter — Runtime Configuration
  # ---------------------------------------------------------------------------
  ConnectOpsReviewConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /connect-ops-review/config
      Type: String
      Description: Runtime configuration for Connect Ops Review - edit to customize
        without redeployment
      Value: !Sub
        - |
          {
            "instanceArn": "${AmazonConnectInstanceARN}",
            "s3ReportingBucket": "${AmazonS3ForReports}",
            "daysBack": 14,
            "generateHtmlReport": ${GenerateHtmlReport_Bool},
            "retainJsonData": ${RetainJsonData_Bool},
            "enableGlueCatalog": ${EnableGlueCatalog_Bool},
            "analyzers": {
              "security": true,
              "resilience": true,
              "cloudtrail": true,
              "operational_excellence": true,
              "capacity": true,
              "observability": true,
              "cost": true,
              "ai": true
            },
            "analyzerTimeouts": {
              "security": 240,
              "resilience": 240,
              "cloudtrail": 840,
              "operational_excellence": 240,
              "capacity": 540,
              "observability": 540,
              "cost": 240,
              "ai": 540
            }
          }
        - GenerateHtmlReport_Bool: !FindInMap [BooleanMap, !Ref EnableHtmlReport, Value]
          RetainJsonData_Bool: !FindInMap [BooleanMap, !Ref RetainJsonData, Value]
          EnableGlueCatalog_Bool: !FindInMap [BooleanMap, !Ref EnableGlueCatalog, Value]

  # ---------------------------------------------------------------------------
  # EventBridge Scheduler — IAM Role for starting Step Functions
  # ---------------------------------------------------------------------------
  SchedulerSFNRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: !Sub ConnectOpsReview-SchedulerRole-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt OrchestratorStateMachine.Arn

  # ---------------------------------------------------------------------------
  # EventBridge Scheduler — Recurring Schedule targeting State Machine
  # ---------------------------------------------------------------------------
  ReviewScheduler:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleEnabled
    Properties:
      Name: ConnectOpsReview-RecurringSchedule
      Description: Recurring Connect Ops Review execution
      GroupName: default
      ScheduleExpression: !Ref ReviewScheduleExpression
      ScheduleExpressionTimezone: !Ref ReviewScheduleTimezone
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt OrchestratorStateMachine.Arn
        RoleArn: !GetAtt SchedulerSFNRole.Arn
        Input: !Sub |
          {
            "instanceArn": "${AmazonConnectInstanceARN}",
            "s3ReportingBucket": "${AmazonS3ForReports}"
          }
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

