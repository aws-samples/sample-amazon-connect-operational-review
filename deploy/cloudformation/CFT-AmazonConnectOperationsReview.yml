Outputs:
  CloudTrailAnalyzerFunctionArn:
    Description: ARN of the CloudTrail Analyzer Lambda function
    Value: !GetAtt CloudTrailAnalyzerParallelFunction.Arn

  CloudTrailAnalyzerFunctionName:
    Description: Name of the CloudTrail Analyzer Lambda function
    Value: !Ref CloudTrailAnalyzerParallelFunction

  # Parallel Architecture Outputs
  OrchestratorStateMachineArn:
    Description: ARN of the Step Functions Orchestrator state machine
    Value: !GetAtt OrchestratorStateMachine.Arn

  OrchestratorStateMachineName:
    Description: Name of the Step Functions Orchestrator state machine
    Value: !GetAtt OrchestratorStateMachine.Name

  PrepareContextFunctionArn:
    Description: ARN of the PrepareContext Lambda function
    Value: !GetAtt PrepareContextFunction.Arn

  SecurityAnalyzerFunctionArn:
    Description: ARN of the Security Analyzer Lambda function
    Value: !GetAtt SecurityAnalyzerFunction.Arn

  ResilienceAnalyzerFunctionArn:
    Description: ARN of the Resilience Analyzer Lambda function
    Value: !GetAtt ResilienceAnalyzerFunction.Arn

  OpExAnalyzerFunctionArn:
    Description: ARN of the Operational Excellence Analyzer Lambda function
    Value: !GetAtt OpExAnalyzerFunction.Arn

  CapacityAnalyzerFunctionArn:
    Description: ARN of the Capacity Analyzer Lambda function
    Value: !GetAtt CapacityAnalyzerFunction.Arn

  ObservabilityAnalyzerFunctionArn:
    Description: ARN of the Observability Analyzer Lambda function
    Value: !GetAtt ObservabilityAnalyzerFunction.Arn

  CostAnalyzerFunctionArn:
    Description: ARN of the Cost Analyzer Lambda function
    Value: !GetAtt CostAnalyzerFunction.Arn

  AIAnalyzerFunctionArn:
    Description: ARN of the AI Analyzer Lambda function
    Value: !GetAtt AIAnalyzerFunction.Arn

  ReportGeneratorFunctionArn:
    Description: ARN of the Report Generator Lambda function
    Value: !GetAtt ReportGeneratorFunction.Arn

  SSMConfigParameterName:
    Description: Name of the SSM Parameter storing runtime configuration
    Value: !Ref ConnectOpsReviewConfig

  SharedLambdaRoleArn:
    Description: ARN of the consolidated shared Lambda execution role
    Value: !GetAtt SharedLambdaRole.Arn

  LayerBuilderRoleArn:
    Description: ARN of the consolidated Layer Builder execution role
    Value: !GetAtt LayerBuilderRole.Arn

  ReviewScheduleArn:
    Condition: ScheduleEnabled
    Description: ARN of the EventBridge Scheduler schedule
    Value: !GetAtt ReviewScheduler.Arn