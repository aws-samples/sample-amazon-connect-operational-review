            - Name: instanceId
              Type: string
            - Name: accountId
              Type: string
            - Name: awsRegion
              Type: string
            - Name: componentType
              Type: string
            - Name: timestamp
              Type: string
            - Name: daysBack
              Type: int
            - Name: partial
              Type: boolean
            - Name: findings
              Type: string
        PartitionKeys:
